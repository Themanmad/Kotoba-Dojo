      <p class="note" style="text-align:center">${u.cp ? (pct >= CP_PASS ? 'Stage cleared. Everything in it stays in your reviews.' : 'Look over the items below, do your reviews, then try the checkpoint again. Missed items are already back in your reviews.') : `${L.words.length} words${L.kanji.length ? ` and ${L.kanji.length} kanji` : ''} from this lesson are now in your reviews. They’ll come back on Home when they’re due.`}</p>
      ${Q.missed.length ? `<div class="label">Worth another look</div><div class="list">${[...new Set(Q.missed)].map(x => x.kind === 'kanji' ? `<button class="row" data-open="${esc(x.id)}"><span class="rw jp" style="font-size:24px">${x.k}</span><span class="rm">${esc(x.m)}</span></button>` : vRow(x)).join('')}</div>` : ''}
      ${u.cp && pct < CP_PASS ? `<button class="btn" onclick="App.lesson('${u.id}')">Try the checkpoint again</button>` : ''}${nu && nu !== u && !unitDone(nu) ? `<button class="btn${u.cp && pct < CP_PASS ? ' line' : ''}" onclick="App.lesson('${nu.id}')">Next: ${esc(nu.t)}</button>` : ''}
      <button class="btn line" onclick="App.go('path')">Back to Path</button>`;
    return `${head}<div class="lesson">${body}</div>`;
  }
  return `${head}<div class="lesson">${body}</div>
    <div class="lnav">${L.i ? `<button class="btn line" onclick="App.lessonStep(-1)">‹ Back</button>` : '<span></span>'}<button class="btn" onclick="App.lessonStep(1)">${L.steps[L.i + 1] === 'quiz' ? 'Practice' : next} ›</button></div>`;
}
function finishLesson(L, pct) {
  L.saved = true;
  schedule.silent = true; for (const x of [...L.words, ...L.kanji]) if (!progress[x.id]) schedule(x, 2); schedule.silent = false;   // new words and kanji join the review schedule
  const prev = pathSt.done[L.u.id];
  pathSt.done[L.u.id] = { d: today(), sc: Math.max(pct, prev ? prev.sc : 0) }; savePath(); if (!L.u.cp || pct >= CP_PASS) dayFlag('lesson');
  L.stars = gameLesson(L.u, pct); L.xp = game.xp - (L.xp0 ?? game.xp);
  if (gameOn()) setTimeout(() => celebrate(L.u.cp ? (pct >= CP_PASS ? 'Stage cleared!' : 'Almost there') : ['よくできました! Well done', 'すごい! Great job', 'やった! Lesson complete'][L.stars - 1] || 'Lesson complete', `${L.stars} ★ · +${L.xp} XP`), 150);
}

/* ---------- placement check ----------
   JLPT-style questions from the mock-exam generators (kanji reading, writing, word in context,
   paraphrase, grammar form, sentence order), reading comprehension and, with the full data, listening.
   About 13 per level, from N5 up; it stops at the first level under 75%. */
const PLACE_COUNTS = { kr: 2, hy: 1, bm: 2, ik: 1, gf: 3, ord: 1 }, PLACE_PASS = 0.75;
const PLACE_SKILL = { kr: 'v', hy: 'v', bm: 'v', ik: 'v', gf: 'g', ord: 'g', li: 'l', r: 'r' };
function placeQs(l) {
  const words = (DATA.vocab[l] || []).filter(x => x.w && x.m), gram = G.filter(g => g.lvl === l), qs = [], used = new Set();
  const common = words.slice().sort((a, b) => b.freq - a.freq).slice(0, 150);
  for (const [key, n] of Object.entries(PLACE_COUNTS)) {
    let k = n;
    const cands = shuffle(key === 'gf' || key === 'ord' ? (key === 'ord' ? gram.concat(common) : gram) : common);
    const pool = key === 'gf' ? (gram.length >= 6 ? gram : G) : words;
    for (const it of cands) { if (k <= 0) break; if (used.has(key + it.id)) continue; const q = examStyleQ(key, it, l, pool); if (q) { q.sk = key; qs.push(q); used.add(key + it.id); k--; } }
  }
  for (const x of shuffle(common)) { if (qs.filter(q => q.sk === 'r').length >= 2) break; const q = readQ(x, common); if (q) qs.push(q); }
  if (DATA.mode === 'full') for (const x of shuffle(common)) { const q = examStyleQ('li', x, l, words); if (q) { q.sk = 'li'; qs.push(q); break; } }
  // kanji: a word written in kanji → its reading, and a kanji → its meaning
  shuffle(K.filter(k => k.lvl === l)).slice(0, 1).forEach(k => { const q = makeQ('kanji', k, 'k2m'); q.sk = 'kj'; qs.push(q); });
  return shuffle(qs);
}
function vPlace() {
  const P = S.place; if (!P) return vPath();
  const head = `<div class="qtop"><button class="ghost" onclick="App.placeQuit()">✕ Close</button><span class="qtitle">Placement check${P.stage === 'run' ? ` · ${P.lv}` : ''}</span><span style="width:34px"></span></div>`;
  if (P.stage === 'intro') return `${head}<div class="lesson"><div class="ls-h"><div class="ls-k">About 10 minutes</div><h2>Let’s find where you should start</h2>
    <p class="note">These are JLPT-style questions: readings, writing, words in context, grammar, sentence order and short reading, plus listening once the full data is built. It starts at N5 and moves up a level each time you score 75% or more, so it gets harder as you go. Don’t guess: “I don’t know” gives a truer result.</p></div>
    <div class="label">Do you know hiragana and katakana?</div>
    <div class="choices"><button class="choice" onclick="App.placeKana(true)"><span>Yes, check me</span></button><button class="choice" onclick="App.placeKana(false)"><span>Not yet, or only some</span></button></div></div>`;
  if (P.stage === 'loading') return `${head}<div class="lesson"><p class="note">Getting ${esc(P.lv)} questions ready…</p></div>`;
  if (P.stage === 'done') {
    const r = P.result;
    return `${head}<div class="lesson"><div class="card score"><div class="arrive">Start here</div><div class="big" style="font-size:34px">${esc(r.label)}</div><div>${esc(r.note)}</div></div>
      ${r.rows.length ? `<div class="label">How you did</div><div class="card placerows">${r.rows.map(x => `<div class="lnrow" style="--lc:${lcVar(x.l)}"><span class="tag lv">${x.l}</span><div class="pbar"><i style="width:${x.pct}%"></i></div><span>${x.pct}%</span></div><div class="psk">${x.parts}</div>`).join('')}</div>` : ''}
      ${r.tip ? `<p class="note">${esc(r.tip)}</p>` : ''}
      ${r.kana ? `<button class="btn" onclick="App.go('kana')">Learn kana first</button>` : ''}
      <button class="btn${r.kana ? ' line' : ''}" onclick="App.lesson('${r.unit}')">Start ${esc(r.label)}</button>
      <button class="btn line" onclick="App.go('path')">See the whole Path</button></div>`;
  }
  const q = P.qs[P.i]; if (!q) return `${head}<div class="lesson"><p class="note">…</p></div>`;
  const opts = q.opts.map((o, i) => { let c = 'choice'; if (P.answered) c += (o.ok ? ' ok' : i === P.chosen ? ' bad' : ' dim'); return `<button class="${c}" onclick="App.placeAns(${i})"${P.answered ? ' disabled' : ''}><span class="n">${i + 1}</span><span>${o.html}</span></button>`; }).join('');
  return `${head}<div class="track lsteps" aria-hidden="true">${P.qs.map((_, i) => `<i class="${i < P.i ? 'ok' : i === P.i ? 'cur' : ''}"></i>`).join('')}</div>
    <div class="lesson"><div class="card prompt">${q.prompt}${q.meta ? `<div class="pmeta">${q.meta}</div>` : ''}${q.sk === 'li' ? sayBtn(q.au, 'say') : ''}</div><div class="hint">${q.hint || ''}</div>
    <div class="choices ${q.grid ? 'grid2' : ''}">${opts}<button class="choice idk${P.answered && P.chosen === -1 ? ' bad' : ''}" onclick="App.placeAns(-1)"${P.answered ? ' disabled' : ''}><span>I don’t know</span></button></div>
    ${P.answered ? `${answerCard(q.item)}<div class="lnav"><span></span><button class="btn" onclick="App.placeNext()">Next ›</button></div>` : ''}</div>`;
}
async function placeLevel() {
  const P = S.place, l = P.lv;
  P.stage = 'loading'; render();
  if (DATA.mode === 'full') { try { await Promise.all([load('vocab', l), load('grammar', l)]); } catch (e) {} }
  P.qs = placeQs(l); P.i = 0; P.answered = false; P.chosen = -1; P.stage = 'run';
  if (P.qs.length < 5) return placeFinish();   // not enough data for this level (starter set): stop here
  render();
}
function placeFinish() {
  const P = S.place, lab = { v: 'Words', kj: 'Kanji', g: 'Grammar', r: 'Reading', l: 'Listening' };
  const rows = Object.entries(P.tally).map(([l, t]) => ({ l, pct: t.n ? Math.round(t.ok / t.n * 100) : 0, t,
    parts: Object.entries(lab).filter(([k]) => t[k] && t[k][1]).map(([k, n]) => `${n} ${t[k][0]}/${t[k][1]}`).join(' · ') }));
  const last = rows[rows.length - 1], us = trackUnits('jlpt');
  let unit, label, note, tip = '';
  const startIn = (l, pct) => {   // where in a level to start: further in the better you did
    const ls = us.filter(u => u.lvl === l && !u.cp && !u.exam); if (!ls.length) return null;
    const f = Math.max(0, Math.min(0.6, (pct - 40) / 60)), u = ls[Math.floor(f * ls.length)];
    return { u, label: `${l} · Lesson ${u.n}` };
  };
  if (P.kanaWeak) { unit = us[0].id; label = 'N5 · Lesson 1'; note = 'Your kana needs a little more work first. Learn it in the Kana section, then start Lesson 1.'; }
  else if (last && last.pct >= PLACE_PASS * 100) {
    const nl = LV[LV.indexOf(last.l) + 1], s = nl && startIn(nl, 0);
    if (s) { unit = s.u.id; label = s.label; note = `You passed ${last.l} comfortably. ${nl} is where you start.`; }
    else { const e = us.find(u => u.exam && u.lvl === last.l) || us[0]; unit = e.id; label = `${last.l} mock exam`; note = DATA.mode === 'full' ? 'You passed every level. Try the N1 mock exam, or review any lesson you like.' : 'Higher levels need the full data. Start the Path or explore the Library meanwhile.'; }
  } else {
    const l = last ? last.l : 'N5', pct = last ? last.pct : 0, s = startIn(l, pct) || { u: us[0], label: 'N5 · Lesson 1' };
    unit = s.u.id; label = s.label;
    note = pct >= 55 ? `You know a fair amount of ${l}. Start part-way in; earlier lessons stay open if you want to fill gaps.` : l === 'N5' ? 'Start from the first lesson. The early ones go quickly if you already know some of it.' : `You’re solid up to ${LV[LV.indexOf(l) - 1]}. ${l} starts here.`;
  }
  const t = last && last.t, r = k => t && t[k] && t[k][1] ? t[k][0] / t[k][1] : null, rv = r('v');
  if (rv !== null && r('g') !== null && r('g') < rv - 0.25) tip = 'Grammar is behind your vocabulary. Take the Pattern step of each lesson slowly and read every line out loud.';
  else if (rv !== null && r('kj') !== null && r('kj') < rv - 0.25) tip = 'Kanji is behind your vocabulary. Open each kanji’s story in the Kanji step; it makes them stick.';
  else if (rv !== null && r('r') !== null && r('r') < rv - 0.25) tip = 'Reading whole sentences is harder for you than single words. The Read step in each lesson is where that improves.';
  P.result = { unit, label, note, tip, rows, kana: !!P.kanaWeak };
  pathSt.place = { d: today(), unit, label, note }; savePath();
  P.stage = 'done'; render();
}

/* simple explanations for the hand-written lessons: a hook ("why this is fun / useful") and short points a child could follow.
   Furigana markup {漢字|かな} as elsewhere. Facts unchanged from the earlier points; only the wording is simpler. */
const SIMPLE = {
'n5-01': { hook: 'After this lesson you can introduce yourself to anyone in Japan.',
  pts: ['は is a pointing finger. It points at who or what you’re talking about. It’s written は but you say “wa”.', 'です is a polite full stop. Put it at the end and your sentence sounds friendly and polite.', 'So {私|わたし}は {学生|がくせい}です means “Me → student.” = I am a student.', 'Japanese loves to skip the obvious. Everyone knows you mean yourself, so you can just say {学生|がくせい}です.', 'Say さん after other people’s names, like “Mr” or “Ms”. Never after your own name.'] },
'n5-02': { hook: 'One tiny sound turns any sentence into a question.',
  pts: ['Add か to the end and the sentence becomes a question, like raising your voice in English. {学生|がくせい}ですか = Are you a student?', 'Answer with はい (yes) or いいえ (no).', 'To say “not”, swap です for じゃないです. {学生|がくせい}じゃないです = I’m not a student.', 'Question words sit where the answer will go: あの{人|ひと}は {誰|だれ}ですか → あの{人|ひと}は {田中|たなか}さんです.'] },
'n5-03': { hook: 'Point at anything in a shop and ask what it is.',
  pts: ['これ = this thing, close to me.', 'それ = that thing, close to you.', 'あれ = that thing over there, far from both of us.', 'どれ = which one?', 'Glued to a noun they become この, その, あの, どの: この {本|ほん} = this book.'] },
'n5-04': { hook: 'の is one of the most common words in Japanese. You’ll see it everywhere.',
  pts: ['の is like an apostrophe-s. {私|わたし}の {本|ほん} = my book (me’s book).', 'It also means “about” or “of”: {日本語|にほんご}の {先生|せんせい} = a teacher of Japanese.', '{誰|だれ}の = whose?', 'If everyone knows the thing, drop it: {私|わたし}のです = it’s mine.'] },
'n5-05': { hook: 'Never get lost again: ask where anything is.',
  pts: ['ここ = here, そこ = there (near you), あそこ = over there, どこ = where?', 'Notice they match これ, それ, あれ, どれ. Same pattern, for places.', 'Ask: [place] は どこですか. Answer: [place] は あそこです.', 'Start politely with すみません, “excuse me”.'] },
'n5-06': { hook: 'Shopping and prices: numbers you’ll use every single day in Japan.',
  pts: ['Numbers are built like blocks: {十|じゅう} 10, {二十|にじゅう} 20 (two tens), {二十三|にじゅうさん} 23.', 'A few sounds change to be easier to say: {三百|さんびゃく} 300, {六百|ろっぴゃく} 600, {八百|はっぴゃく} 800, {三千|さんぜん} 3,000.', 'Big numbers count in ten-thousands: {一万|いちまん} = 10,000. So {一万円|いちまんえん} is ten thousand yen.', 'いくらですか = how much is it?'] },
'n5-07': { hook: 'Know when the shop opens, when the train leaves, and when to meet.',
  pts: ['{時|じ} = o’clock. {三時|さんじ} = three o’clock. {半|はん} = half past.', 'Three times sound a little different. Learn them as special: {四時|よじ}, {七時|しちじ}, {九時|くじ}.', '{午前|ごぜん} = a.m. and {午後|ごご} = p.m. They go in front: {午後|ごご} {二時|にじ} = 2 p.m.', 'から = from, まで = until. {九時|くじ}から {五時|ごじ}まで = from 9 to 5.'] },
'n5-08': { hook: 'Your first verbs: go, come and go home.',
  pts: ['Polite verbs end in ます. {行|い}く (go) becomes {行|い}きます.', 'To say you don’t: ません. {行|い}きません = I don’t go / won’t go.', 'へ marks where you’re heading, like an arrow →. It’s written へ but you say “e”. に works too.', 'The verb always comes last: {学校|がっこう}へ {行|い}きます = school → go.'] },
'n5-09': { hook: 'Eat, drink, watch, read: talk about your day.',
  pts: ['を marks the thing you do the action to. パンを {食|た}べます = bread ← eat. You say を like “o”.', 'Two easy kinds of verbs to start with:', 'Verbs ending in -eru or -iru usually just drop る: {食|た}べる → {食|た}べます, {見|み}る → {見|み}ます.', 'Most other verbs change their last sound from u to i: {飲|の}む → {飲|の}みます, {買|か}う → {買|か}います.', 'A few sneaky verbs look like the first kind but follow the second: {帰|かえ}る → {帰|かえ}ります, {入|はい}る → {入|はい}ります. The word cards tell you which is which.'] },
'n5-10': { hook: 'Three tiny words that tell where, how and when.',
  pts: ['で = where something happens: {図書館|としょかん}で {勉強|べんきょう}します (study at the library).', 'で also = how you do it: {電車|でんしゃ}で {行|い}きます (go by train).', 'に = at a clock time: {七時|しちじ}に {起|お}きます (get up at seven).', 'Words like {今日|きょう}, {明日|あした}, {毎日|まいにち} don’t need に. They’re already “when” words.'] },
'n5-11': { hook: 'Tell stories about yesterday.',
  pts: ['Past tense is easy: ます → ました. {食|た}べました = I ate.', 'Didn’t: ません → ませんでした. {行|い}きませんでした = I didn’t go.', 'と = with someone: {友達|ともだち}と = with a friend.', 'Time words: {昨日|きのう} yesterday, {先週|せんしゅう} last week, {去年|きょねん} last year.'] },
'n5-12': { hook: 'Describe things: big, small, cheap, delicious.',
  pts: ['These describing words end in い: {高|たか}い (expensive), {安|やす}い (cheap), おいしい (tasty).', 'Put them right before a thing: {高|たか}い {時計|とけい} = an expensive watch.', 'To end a sentence, add です: {高|たか}いです.', 'To say “not”, change い to くない: {高|たか}くないです. One odd one: いい (good) → よくないです.', 'とても = very. あまり … ない = not very.'] },
'n5-13': { hook: 'The other family of describing words.',
  pts: ['Some describing words need な before a thing: {静|しず}かな {町|まち} = a quiet town.', 'At the end of a sentence they act like nouns: {静|しず}かです, {静|しず}かじゃないです.', 'Trick word: きれい ends in い but it’s a な word: きれいな {部屋|へや}.'] },
'n5-14': { hook: 'Say what’s where: in, on, under, next to.',
  pts: ['あります = there is (things that can’t move by themselves: books, shops, trees).', 'います = there is (living things that move: people, cats, dogs).', '[place] に [thing] が あります: {机|つくえ}の {上|うえ}に {本|ほん}が あります = on the desk there is a book.', 'Position words use の: {机|つくえ}の {上|うえ} (on), {下|した} (under), {中|なか} (inside), {前|まえ} (front), {後|うし}ろ (behind), {隣|となり} (next to).'] },
'n5-15': { hook: 'Talk about what you love, hate and are good at.',
  pts: ['With “like” and “good at” words, the thing gets が, not を: {音楽|おんがく}が {好|す}きです.', 'The same for {嫌|きら}い (dislike), {上手|じょうず} (good at), {下手|へた} (bad at), {分|わ}かる (understand).', '{大好|だいす}き = really love. {好|す}きじゃないです is a softer way to say you don’t like something.', 'Japanese people are modest: never call yourself {上手|じょうず}. Say {少|すこ}し {分|わ}かります instead.'] },
'n5-16': { hook: 'Wishes and dreams: “I want to go to Japan!”',
  pts: ['Take a ます verb, swap ます for たいです: {行|い}きます → {行|い}きたいです (want to go).', 'Don’t want to: たくないです.', 'Use it for your own wishes. To ask someone else: {何|なに}を したいですか.'] },
'n5-17': { hook: 'Make plans and invite friends.',
  pts: ['〜ませんか is a polite invitation: “won’t you …?” {行|い}きませんか = won’t you come?', '〜ましょう = let’s … {行|い}きましょう = let’s go!', '〜ましょうか = shall we? or shall I?', 'To say no kindly, just say ちょっと… and let it trail off. Everyone understands.'] },
'n5-18': { hook: 'The て-form is a super-power: you’ll use it in dozens of later lessons.',
  pts: ['て-form + ください = please do it. {待|ま}ってください = please wait.', 'Making it, part 1: -eru / -iru verbs swap る for て: {食|た}べる → {食|た}べて, {見|み}る → {見|み}て.', 'Making it, part 2 (other verbs), by last sound: う・つ・る → って; む・ぶ・ぬ → んで; く → いて; ぐ → いで; す → して.', 'Rule-breakers: {行|い}く → {行|い}って, する → して, {来|く}る → {来|き}て.', 'Tip: sing the endings to a tune. Lots of learners remember them as a little song.'] },
'n5-19': { hook: 'Say what’s happening right now.',
  pts: ['て-form + います = happening now: {雨|あめ}が {降|ふ}っています = it’s raining.', 'It also means a state that keeps going: {東京|とうきょう}に {住|す}んでいます = I live in Tokyo.', 'Same idea: {働|はたら}いています (I work), {結婚|けっこん}しています (I’m married), {知|し}っています (I know).', 'Watch out: “I don’t know” is {知|し}りません.'] },
'n5-20': { hook: 'Ask “may I?” and understand signs and rules.',
  pts: ['て-form + も いいですか = may I …? {座|すわ}っても いいですか = may I sit?', 'Yes: はい、どうぞ (go ahead).', 'て-form + は いけません = you must not … {撮|と}っては いけません = no photos.', 'On signs you’ll often see 〜ないでください = please don’t.'] },
'n5-21': { hook: 'How was it? Talk about your trip, a film, a meal.',
  pts: ['い words: drop い, add かったです. {楽|たの}しい → {楽|たの}しかったです (it was fun).', 'Wasn’t: くなかったです. {寒|さむ}くなかったです (it wasn’t cold).', 'な words and nouns: でした. {静|しず}かでした (it was quiet).', 'いい is the odd one again: よかったです (it was good).'] },
'n5-22': { hook: 'Bigger, faster, best: compare things.',
  pts: ['A より B のほうが … = B is more … than A. バスより {電車|でんしゃ}のほうが {速|はや}いです.', 'Ask which of two: A と B と どちらが …ですか.', 'The best of a group: [group] の {中|なか}で [thing] が {一番|いちばん} … .', 'The describing word never changes. より and {一番|いちばん} do all the work.'] },
'n5-23': { hook: 'Join your ideas: because, and but.',
  pts: ['から = because. Reason から, result: {雨|あめ}ですから、{行|い}きません (it’s raining, so I won’t go).', 'Answer “why?” (どうして) with … からです.', 'が = but, joining two sentences: {高|たか}いですが、おいしいです (expensive but tasty).', 'でも = but, starting a new sentence.'] }
};


/* =====================================================================
   GAME MODE — dojo belts earned with XP, stars per lesson, badges, combos and a daily time goal.
   XP and badges are always counted, so switching to game mode shows what you've already earned;
   they're only shown when Settings → Learning style is “Game”. The daily goal shows in both styles.
   ===================================================================== */
const BELTS = [
  { xp: 0, name: 'White belt', jp: '白帯', c: '#E9ECEF', t: '#1C2127' }, { xp: 400, name: 'Yellow belt', jp: '黄帯', c: '#F4C430', t: '#1C2127' },
  { xp: 1200, name: 'Orange belt', jp: '橙帯', c: '#F0802A', t: '#fff' }, { xp: 2500, name: 'Green belt', jp: '緑帯', c: '#3FA34D', t: '#fff' },
  { xp: 4500, name: 'Blue belt', jp: '青帯', c: '#2B6CC4', t: '#fff' }, { xp: 7500, name: 'Purple belt', jp: '紫帯', c: '#7B4BB7', t: '#fff' },
  { xp: 12000, name: 'Brown belt', jp: '茶帯', c: '#7A4A26', t: '#fff' }, { xp: 18000, name: 'Black belt, 1st dan', jp: '初段', c: '#16181C', t: '#fff' },
  { xp: 30000, name: 'Black belt, 2nd dan', jp: '二段', c: '#16181C', t: '#F4C430' }, { xp: 50000, name: 'Black belt, 3rd dan', jp: '三段', c: '#16181C', t: '#F4C430' }
];
const BADGES = [
  { id: 'first', icon: '🎌', name: 'First step', how: 'Finish your first lesson' },
  { id: 'perfect', icon: '💯', name: 'Perfect', how: 'Get every practice question right in a lesson' },
  { id: 'goal', icon: '🎯', name: 'On target', how: 'Reach your daily goal' },
  { id: 'streak3', icon: '🔥', name: 'Warming up', how: 'Study 3 days in a row' },
  { id: 'streak7', icon: '🔥', name: 'One week strong', how: 'Study 7 days in a row' },
  { id: 'streak30', icon: '🏮', name: 'Habit master', how: 'Study 30 days in a row' },
  { id: 'words100', icon: '📚', name: '100 words', how: 'Have 100 words in your reviews' },
  { id: 'words500', icon: '📖', name: '500 words', how: 'Have 500 words in your reviews' },
  { id: 'kanji50', icon: '字', name: '50 kanji', how: 'Have 50 kanji in your reviews' },
  { id: 'stage', icon: '⛩️', name: 'Stage cleared', how: 'Clear a checkpoint' },
  { id: 'combo10', icon: '⚡', name: 'On fire', how: 'Answer 10 in a row correctly' },
  { id: 'travel', icon: '✈️', name: 'Ready to travel', how: 'Finish every Travel lesson' },
  { id: 'exam', icon: '🏆', name: 'Exam ready', how: 'Score 80%+ on a mock exam' }
];
let game = Object.assign({ xp: 0, badges: {}, stars: {}, combo: 0, goalDays: {} }, store.get('game', {}));
const saveGame = () => store.set('game', game);
const gameOn = () => settings.style === 'game';
const beltOf = xp => { let b = BELTS[0]; for (const x of BELTS) if (xp >= x.xp) b = x; return b; };
const nextBelt = xp => BELTS.find(b => b.xp > xp) || null;
function addXP(n) {
  if (!n) return;
  const before = beltOf(game.xp); game.xp += n; saveGame();
  const after = beltOf(game.xp);
  if (gameOn()) { xpPop(n); if (after !== before) setTimeout(() => celebrate(`New belt: ${after.name}!`, `${after.jp} · keep going`), 400); }
}
function earn(id) {
  if (game.badges[id]) return; game.badges[id] = today(); saveGame();
  const b = BADGES.find(x => x.id === id); if (b && gameOn()) setTimeout(() => celebrate(`Badge: ${b.icon} ${b.name}`, b.how), 900);
}
/** answer hook used by lessons, quizzes and flashcards */
function gameAnswer(ok) {
  if (ok) { game.combo++; addXP(10 + (game.combo >= 5 ? 5 : 0)); if (game.combo >= 10) earn('combo10'); }
  else game.combo = 0;
  saveGame();
}
const starsFor = pct => pct >= 90 ? 3 : pct >= 70 ? 2 : 1;
const starHtml = n => `<span class="stars" aria-label="${n} of 3 stars">${'★'.repeat(n)}${'☆'.repeat(3 - n)}</span>`;
function gameLesson(u, pct) {
  const st = starsFor(pct), prev = game.stars[u.id] || 0;
  if (st > prev) game.stars[u.id] = st;
  addXP(u.cp ? (pct >= CP_PASS ? 150 : 20) : 50 + (pct === 100 ? 25 : 0));
  earn('first'); if (pct === 100 && !u.cp) earn('perfect'); if (u.cp && pct >= CP_PASS) earn('stage');
  if (travelUnits().every(t => pathSt.done[t.id])) earn('travel');
  checkBadges(); saveGame();
  return st;
}
function checkBadges() {
  const st = streak(); if (st >= 3) earn('streak3'); if (st >= 7) earn('streak7'); if (st >= 30) earn('streak30');
  const ids = Object.keys(progress), w = ids.filter(i => i.startsWith('v:')).length, k = ids.filter(i => i.startsWith('k:')).length;
  if (w >= 100) earn('words100'); if (w >= 500) earn('words500'); if (k >= 50) earn('kanji50');
  if (store.get('exams', []).some(h => h.max && h.total / h.max >= 0.8)) earn('exam');
}

/* ---------- daily time goal: counts real study time (lessons, quizzes, reviews, the placement check) ---------- */
let lastAct = Date.now();
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, { capture: true, passive: true }));
const studyMin = () => Math.floor(((actLog[today()] || {}).sec || 0) / 60);
setInterval(() => {
  if (document.hidden || Date.now() - lastAct > 90e3) return;                     // away from the screen: don't count
  const studying = S.session || ['lesson', 'place'].includes(S.view) || $('#sheet').classList.contains('open');
  if (!studying) return;
  const d = today(), e = actLog[d] || { r: 0 }; e.sec = (e.sec || 0) + 15; actLog[d] = e; store.set('log', actLog);
  if (studyMin() >= (settings.goalMin || 15) && !game.goalDays[d]) { game.goalDays[d] = 1; saveGame(); earn('goal'); addXP(50); if (gameOn()) celebrate('Daily goal reached!', `${settings.goalMin || 15} minutes today. お疲れさま!`); else toast(`Daily goal reached: ${settings.goalMin || 15} minutes`); }
  const g = $('#goalbar'); if (g) g.outerHTML = goalBar();
}, 15e3);
function goalBar() {
  const m = studyMin(), goal = settings.goalMin || 15, pct = Math.min(100, m / goal * 100);
  return `<div class="goalbar${pct >= 100 ? ' met' : ''}" id="goalbar"><div class="gb-ring" style="--p:${pct}"><span>${Math.min(m, 999)}</span></div><div class="gb-t"><b>${pct >= 100 ? 'Daily goal reached' : 'Today’s goal'}</b><span>${m} of ${goal} minutes${pct >= 100 ? ' · nice work' : ''}</span></div></div>`;
}
/* ---------- the game card on Home ---------- */
function gameCard() {
  if (!gameOn()) return goalBar();
  const b = beltOf(game.xp), n = nextBelt(game.xp), pct = n ? (game.xp - b.xp) / (n.xp - b.xp) * 100 : 100;
  const got = BADGES.filter(x => game.badges[x.id]);
  return `<div class="card gcard"><div class="gc-top"><span class="belt" style="--bc:${b.c};--bt:${b.t}"><i></i>${esc(b.jp)}</span><div class="gc-n"><b>${esc(b.name)}</b><span>${fmtN(game.xp)} XP${n ? ` · ${fmtN(n.xp - game.xp)} to ${esc(n.name.replace(', ', ' '))}` : ''}</span></div></div>
    <div class="pbar gc-bar"><i style="width:${pct}%;background:${n ? n.c : b.c}"></i></div>
    ${goalBar()}
    <div class="gc-badges">${BADGES.map(x => `<span class="bdg${game.badges[x.id] ? ' got' : ''}" title="${esc(x.name)}: ${esc(x.how)}">${x.icon}</span>`).join('')}</div>
    <div class="gc-foot">${got.length} of ${BADGES.length} badges</div></div>`;
}
/* ---------- little celebrations (game mode only; nothing moves with reduced motion) ---------- */
function xpPop(n) {
  const el = document.createElement('div'); el.className = 'xppop'; el.textContent = `+${n} XP`; document.body.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}
function celebrate(title, sub) {
  const box = document.createElement('div'); box.className = 'celebrate'; box.setAttribute('role', 'status');
  box.innerHTML = `<b>${esc(title)}</b><span>${esc(sub || '')}</span>`; document.body.appendChild(box);
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const cols = ['#4DAF4A', '#F0802A', '#1BA1D8', '#D9A800', '#C2337A', '#22408F'];
    for (let i = 0; i < 36; i++) { const c = document.createElement('i'); c.className = 'confetti'; c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length]; c.style.animationDelay = Math.random() * .3 + 's'; c.style.transform = `rotate(${Math.random() * 360}deg)`; document.body.appendChild(c); setTimeout(() => c.remove(), 2200); }
  }
  setTimeout(() => box.classList.add('out'), 2200); setTimeout(() => box.remove(), 2700);
}

/* =====================================================================
   ANKI DECKS: import an .apkg and the dojo adapts to it.
   The deck stays in this browser (IndexedDB) and is never uploaded anywhere.
   Reads both Anki package formats (collection.anki2 / .anki21 and the newer
   zstd-compressed collection.anki21b), works out which field is the word,
   reading, meaning, sentence, audio and picture, and lets the learner correct it.
   Then:
   - deck words that are dictionary words get the deck's voice, sentence and picture;
   - the rest become a "My deck" level (flashcards, tests, search, browse);
   - Anki review history marks the words you already know, so the Path skips
     lessons you don't need and your reviews start where Anki left off;
   - a "My deck" Path track teaches the deck in its own order, 12 words a lesson.
   Rule-based and on-device: nothing is sent to a server or an AI service.
   ===================================================================== */
const ANKI = { decks: [], items: [], extra: [], known: new Set(), rank: new Map(), krank: new Map(), planKey: '', urls: new Map(), sig: '', ver: 0, busy: '', draft: null, done: null, units: null, unitsSig: '', pending: null };
const ankiDb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('kotoba-anki', 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('decks')) d.createObjectStore('decks', { keyPath: 'id' }); if (!d.objectStoreNames.contains('media')) d.createObjectStore('media'); };
    r.onsuccess = () => res(r.result); r.onerror = () => { dbp = null; rej(r.error); };
  }));
  const tx = async (store, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => { const t = d.transaction(store, mode), req = fn(t.objectStore(store)); t.oncomplete = () => res(req && 'result' in req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Storage aborted')); });
  };
  return {
    get: (st, k) => tx(st, 'readonly', s => s.get(k)),
    all: st => tx(st, 'readonly', s => s.getAll()),
    put: (st, v, k) => tx(st, 'readwrite', s => k === undefined ? s.put(v) : s.put(v, k)),
    del: (st, k) => tx(st, 'readwrite', s => s.delete(k)),
    delPrefix: (st, p) => tx(st, 'readwrite', s => s.delete(IDBKeyRange.bound(p, p + '￿'))),
    putMany: (st, rows) => tx(st, 'readwrite', s => { let last = null; for (const [k, v] of rows) last = s.put(v, k); return last; })
  };
})();

/* ---------- libraries (loaded only when someone imports a deck) ---------- */
const loadScript = src => new Promise((res, rej) => {
  if (document.querySelector(`script[data-src="${src}"]`)) return res();
  const s = document.createElement('script'); s.src = src; s.dataset.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s);
});
let ankiLibsP = null;
function ankiLibs() {
  return ankiLibsP || (ankiLibsP = (async () => {
    for (const f of ['jszip.min.js', 'sql-wasm.js', 'fzstd.js']) await loadScript('vendor/' + f);
    return initSqlJs({ locateFile: f => 'vendor/' + f });
  })().catch(e => { ankiLibsP = null; throw e; }));
}
const isZstd = u => u && u.length > 4 && u[0] === 0x28 && u[1] === 0xB5 && u[2] === 0x2F && u[3] === 0xFD;
const unz = u => isZstd(u) ? fzstd.decompress(u) : u;
/** the new-format media list: protobuf MediaEntries { repeated MediaEntry { string name = 1; uint32 size = 2; bytes sha1 = 3; uint32 legacy_zip_filename = 255 } } */
function ankiPbMedia(u8) {
  let i = 0; const out = [], td = new TextDecoder();
  const varint = () => { let r = 0, s = 0, b; do { b = u8[i++]; r += (b & 0x7f) * 2 ** s; s += 7; } while (b & 0x80 && i < u8.length); return r; };
  const skip = w => { if (w === 0) varint(); else if (w === 1) i += 8; else if (w === 2) { const n = varint(); i += n; } else if (w === 5) i += 4; else throw new Error('Unreadable media list'); };
  while (i < u8.length) {
    const tag = varint(), f = Math.floor(tag / 8), w = tag & 7;
    if (f !== 1 || w !== 2) { skip(w); continue; }
    const len = varint(), end = i + len, e = {};
    while (i < end) {
      const t2 = varint(), f2 = Math.floor(t2 / 8), w2 = t2 & 7;
      if (f2 === 1 && w2 === 2) { const n = varint(); e.name = td.decode(u8.subarray(i, i + n)); i += n; }
      else if (f2 === 255 && w2 === 0) e.legacy = varint();
      else skip(w2);
    }
    i = end; out.push(e);
  }
  return out;
}

/* Anki 2.1.28+ collections sort names with its own "unicase" collation, which plain SQLite doesn't have:
   any query on those tables fails ("no query solution" / "no such collation sequence: unicase").
   Strip the collation from the schema and drop the indexes built with it, then reopen the copy in memory.
   (Reading only; the deck file itself is never changed.) */
function ankiOpenDb(SQL, bytes) {
  let db = new SQL.Database(bytes);
  const n = db.exec("select count(*) from sqlite_master where sql like '%unicase%'");
  if (!n.length || !n[0].values[0][0]) return db;
  db.exec(`PRAGMA writable_schema = ON;
    DELETE FROM sqlite_master WHERE type = 'index' AND sql IS NOT NULL AND tbl_name IN (SELECT name FROM sqlite_master WHERE type = 'table' AND sql LIKE '%unicase%');
    UPDATE sqlite_master SET sql = replace(replace(replace(sql, ' COLLATE unicase', ''), ' collate unicase', ''), ' COLLATE UNICASE', '') WHERE sql LIKE '%unicase%';
    PRAGMA writable_schema = OFF;`);
  const fixed = db.export(); db.close();
  return new SQL.Database(fixed);
}

/* ---------- reading a package ---------- */
async function ankiRead(file, step) {
  step('Loading the deck reader…');
  const SQL = await ankiLibs();
  step('Opening the package…');
  const zip = await JSZip.loadAsync(file);
  const colName = ['collection.anki21b', 'collection.anki21', 'collection.anki2'].find(n => zip.file(n));
  if (!colName) throw new Error('There is no Anki collection inside this file. Export it from Anki as “Anki Deck Package (.apkg)”.');
  const colBytes = unz(await zip.file(colName).async('uint8array'));
  const media = {};   // file name used in the cards → entry in the zip
  const mf = zip.file('media');
  if (mf) {
    const raw = unz(await mf.async('uint8array'));
    const head = new TextDecoder().decode(raw.subarray(0, 16)).trim();
    if (head.startsWith('{')) { const j = JSON.parse(new TextDecoder().decode(raw)); for (const [k, v] of Object.entries(j)) media[v] = k; }
    else ankiPbMedia(raw).forEach((e, i) => { if (e.name) media[e.name] = String(e.legacy ?? i); });
  }
  step('Reading the cards…');
  const db = ankiOpenDb(SQL, colBytes);
  try {
    const q = sql => { const r = db.exec(sql); if (!r.length) return []; const { columns, values } = r[0]; return values.map(v => Object.fromEntries(columns.map((c, i) => [c, v[i]]))); };
    const has = t => q(`select name from sqlite_master where type='table' and name='${t}'`).length > 0;
    const col = q('select * from col')[0] || {};
    const types = new Map(), deckNames = new Map();
    if (has('notetypes') && has('fields')) {
      for (const r of q('select id, name from notetypes')) types.set(String(r.id), { id: String(r.id), name: r.name, fields: [] });
      for (const r of q('select ntid, ord, name from fields order by ntid, ord')) { const t = types.get(String(r.ntid)); if (t) t.fields[r.ord] = r.name; }
    } else if (col.models) {
      for (const [id, m] of Object.entries(JSON.parse(col.models))) types.set(String(id), { id: String(id), name: m.name, fields: (m.flds || []).slice().sort((a, b) => a.ord - b.ord).map(f => f.name) });
    }
    if (has('decks')) for (const r of q('select id, name from decks')) deckNames.set(String(r.id), String(r.name).split('\x1f').join('::'));
    else if (col.decks) for (const [id, d] of Object.entries(JSON.parse(col.decks))) deckNames.set(String(id), d.name);
    const cards = new Map(), didCount = new Map();
    for (const c of q('select nid, did, type, queue, due, ivl, reps, lapses from cards')) {
      const k = String(c.nid), prev = cards.get(k);
      if (!prev || (c.ivl || 0) > (prev.ivl || 0)) cards.set(k, c);
      didCount.set(String(c.did), (didCount.get(String(c.did)) || 0) + 1);
    }
    for (const n of q('select id, mid, flds, tags from notes order by id')) {
      const t = types.get(String(n.mid)); if (!t) continue;
      (t.notes = t.notes || []).push({ id: String(n.id), f: String(n.flds).split('\x1f'), tags: String(n.tags || '').trim(), card: cards.get(String(n.id)) || null });
    }
    const list = [...types.values()].filter(t => t.notes && t.notes.length).sort((a, b) => b.notes.length - a.notes.length);
    if (!list.length) throw new Error('This deck has no notes in it.');
    const did = [...didCount.entries()].sort((a, b) => b[1] - a[1])[0];
    const full = (did && deckNames.get(did[0])) || file.name.replace(/\.apkg$/i, '');
    return { file: file.name, name: full.split('::').pop().trim() || full, crt: +col.crt || 0, types: list, media, zip };
  } finally { db.close(); }
}

const HAS_JP = /[぀-ヿ㐀-鿿々]/, HAS_LATIN = /[A-Za-z]/;
function ankiText(html) {
  const s = String(html || '').replace(/\[sound:[^\]]*\]/g, ' ')
    .replace(/<ruby>(?:<rb>)?(.*?)(?:<\/rb>)?<rt>(.*?)<\/rt>\s*<\/ruby>/gi, ' $1[$2]')
    .replace(/<br\s*\/?>|<\/(div|p|li)>/gi, ' ');
  const doc = new DOMParser().parseFromString(`<body>${s}</body>`, 'text/html');   // inert: nothing in the deck's HTML runs or loads
  return (doc.body.textContent || '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
}
/** Anki furigana ("食[た]べる", "日本 語[ご]") → [[text, reading|null] …]; a base runs back to the previous space */

    fr.readAsText(file);
  },
  reset() { if (!confirm('Reset all progress? This cannot be undone.')) return; progress = {}; actLog = {}; save(); store.set('log', actLog); toast('Progress reset'); render(); },
  sheetBack() { if (sheetStack.length < 2) return App.closeSheet(); if (sheetPushed > 0) history.back(); else popSheet(); },
  closeSheet() {
    if (!$('#sheet').classList.contains('open')) return;
    if (sheetPushed > 0) { sheetClosing = true; const n = sheetPushed; sheetPushed = 0; hideSheet(); try { history.go(-n); } catch (e) { sheetClosing = false; } }
    else hideSheet();
  }
};

/* delegated taps: audio, detail sheets, tap-to-reveal furigana */
document.addEventListener('click', e => {
  const say = e.target.closest('[data-audio]'); if (say && !say.dataset.open) { e.stopPropagation(); playAudio(say.dataset.audio, true); return; }
  const rb = e.target.closest('ruby');
  if (e.target.closest('.kcx') && rb && document.body.classList.contains('furi-tap') && !rb.classList.contains('show')) { rb.classList.add('show'); e.stopPropagation(); return; }   // tap-to-reveal furigana: first tap shows the reading
  const kc = e.target.closest('.kcx'); if (kc) { e.stopPropagation(); showWordPop(kc); return; }
  if (document.querySelector('.kpop') && !e.target.closest('.kpop')) { closeWordPop(); e.stopPropagation(); e.preventDefault(); return; }   // first tap outside only dismisses the pop-up
  const op = e.target.closest('[data-open]'); if (op) { const inPop = !!op.closest('.kpop'); if (inPop) { e.stopPropagation(); closeWordPop(); } openSheet(op.dataset.open); return; }
  if (rb && document.body.classList.contains('furi-tap') && !e.target.closest('.choice')) { rb.classList.toggle('show'); e.stopPropagation(); }
}, true);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('kcx')) { e.preventDefault(); showWordPop(e.target); return; }
  if (e.key === 'Escape' && document.querySelector('.kpop')) { e.preventDefault(); e.stopPropagation(); closeWordPop(); return; }
  if ($('#sheet').classList.contains('open')) {
    if (e.key === 'Escape') return App.closeSheet();
    if ((e.key === 'Backspace' || e.key === 'ArrowLeft') && sheetStack.length > 1) { e.preventDefault(); return App.sheetBack(); }
    return;
  }
  if (e.key === 'Escape') return;
  const s = S.session; if (!s) return;
  if (s.mode === 'exam') { if (s.done) return; if (/^[1-4]$/.test(e.key)) examPick(+e.key - 1); else if (e.key === 'ArrowRight') examGo(1); else if (e.key === 'ArrowLeft') examGo(-1); return; }
  if (s.mode === 'cards' && s.done) { if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); back(); } return; }
  if (s.done) return;
  if (s.mode === 'cards') {
    if ((e.key === ' ' || e.key === 'Enter') && !s.flipped) { e.preventDefault(); flip(); }
    else if (/^[1-4]$/.test(e.key) && s.flipped) rate(+e.key - 1);
    else if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'z') { e.preventDefault(); back(); }
    return;
  }
  if (/^[1-4]$/.test(e.key) && !s.answered) answer(+e.key - 1);
  else if ((e.key === 'Enter' || e.key === ' ') && s.answered) { e.preventDefault(); next(); }
});

applySettings();
boot().then(render, err => { console.error(err); render(); }).then(() => ankiBoot()).catch(e => console.error(e));
</script>
