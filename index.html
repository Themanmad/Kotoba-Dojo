<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kotoba Dojo</title>
<meta name="description" content="Learn Japanese vocabulary and kanji with multiple-choice practice, tests, furigana and frequency info.">
<meta name="theme-color" content="#c8102e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2;--card:#ffffff;--ink:#1d1b19;--muted:#6f675e;--line:#e8e1d7;--chip:#f2ede5;
  --accent:#c8102e;--accent-soft:#fbe9ec;--ok:#1f8a4c;--ok-soft:#e6f5ec;--bad:#c62828;--bad-soft:#fdeceb;
  --warn:#b7791f;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141312;--card:#1e1c1a;--ink:#f2ede7;--muted:#a69e94;--line:#34302c;--chip:#292623;
    --accent:#ff5a6e;--accent-soft:#3a1d22;--ok:#4cc483;--ok-soft:#163023;--bad:#ff6b6b;--bad-soft:#3a1b1b;
    --warn:#e2b04a;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141312;--card:#1e1c1a;--ink:#f2ede7;--muted:#a69e94;--line:#34302c;--chip:#292623;
  --accent:#ff5a6e;--accent-soft:#3a1d22;--ok:#4cc483;--ok-soft:#163023;--bad:#ff6b6b;--bad-soft:#3a1b1b;
  --warn:#e2b04a;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
.jp{font-family:"Noto Sans JP",sans-serif}
button{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.logo{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:"Noto Sans JP";font-weight:700;font-size:15px}
.brand{font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:-2px}
main{max-width:640px;margin:0 auto;padding:16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:7px 0 9px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav.tabs button b{font-family:"Noto Sans JP";font-size:20px;font-weight:500;line-height:1.3}
nav.tabs button.on{color:var(--accent)}
h1{font-size:23px;margin:4px 0 4px;letter-spacing:-.01em}
h1 .muted{font-weight:500}
.sub{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.btn{appearance:none;border:0;background:var(--accent);color:#fff;font-weight:600;padding:13px 18px;border-radius:12px;cursor:pointer;width:100%;font-size:15px;margin-top:14px}
.btn:active{transform:scale(.99)}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:none;border:1.5px solid var(--bad);color:var(--bad)}
.ghost{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 4px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-size:14px;color:var(--muted);cursor:pointer;line-height:1.2}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px;font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:12px}
/* home */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.pbar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.actions{display:grid;gap:10px;margin-top:16px}
.action{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.action .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:"Noto Sans JP";font-size:22px;font-weight:700;flex:none}
.action b{display:block}
.action span{font-size:13px;color:var(--muted)}
.wotd{margin-top:16px}
.wotd .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.wotd .w{font-size:30px;margin:6px 0 2px}
/* frequency */
.freq{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);vertical-align:middle;white-space:nowrap}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:13px}
.bars i{width:4px;background:var(--line);border-radius:1px}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:11px}.bars i:nth-child(5){height:13px}
.f5 .bars i.on,.f4 .bars i.on{background:var(--accent)}
.f3 .bars i.on{background:var(--warn)}
.f2 .bars i.on,.f1 .bars i.on{background:var(--muted)}
/* ruby */
ruby rt{font-size:.48em;color:var(--muted);font-weight:400}
body.furi-tap ruby:not(.show) rt{visibility:hidden}
body.furi-tap .force ruby rt{visibility:visible}
body.furi-tap .prompt ruby{cursor:pointer}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;color:var(--muted)}
.qbar{height:5px;background:var(--chip);border-radius:99px;overflow:hidden;margin-bottom:12px}
.qbar i{display:block;height:100%;background:var(--accent)}
.prompt{text-align:center;padding:30px 16px 18px;position:relative}
.pword{font-size:42px;font-weight:500;line-height:1.7}
.pkanji{font-size:80px;line-height:1.2;font-weight:500}
.pmean{font-size:24px;font-weight:600;line-height:1.3;padding:10px 0}
.proma{color:var(--muted);font-size:14px;margin-top:-4px}
.pmeta{margin-top:12px}
.say{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px;display:grid;place-items:center}
.say.inl{position:static;width:32px;height:32px;font-size:14px;flex:none}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 4px}
.choices{display:grid;gap:10px;margin-top:10px}
.choices.grid2{grid-template-columns:1fr 1fr}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px;font-size:16px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:56px;transition:border-color .15s,background .15s}
.choice:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.choices.grid2 .choice{flex-direction:column;justify-content:center;gap:6px;text-align:center;min-height:92px}
.choice .n{width:22px;height:22px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none}
.choices.grid2 .choice .n{display:none}
.cjp{font-size:22px;line-height:1.7}
.ckanji{font-size:40px;line-height:1.2}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft)}
.choice.dim{opacity:.5}
.verdict{margin-top:16px;padding:12px 14px;border-radius:12px;font-weight:600}
.verdict.good{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
/* detail */
.detail{margin-top:12px}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dword{font-size:34px;line-height:1.7;font-weight:500}
.dread{color:var(--muted);font-size:14px}
.dmean{font-size:19px;font-weight:600;margin:8px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.tag{font-size:12px;background:var(--chip);border-radius:6px;padding:3px 8px;color:var(--muted)}
.tag.lv{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ex{margin-top:12px;padding:12px;border-radius:12px;background:var(--chip);display:flex;gap:10px;align-items:flex-start}
.ex .jp{font-size:17px;line-height:1.9}
.ex .en{font-size:13px;color:var(--muted)}
.kchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px}
.kchip b{font-family:"Noto Sans JP";font-size:20px;font-weight:500}
.mini{font-size:12px;color:var(--muted);margin-top:10px}
.khead{display:flex;gap:16px;align-items:center}
.kbig{font-size:76px;line-height:1.1;width:104px;height:104px;border-radius:18px;background:var(--chip);display:grid;place-items:center;flex:none}
.reads{display:grid;gap:8px;margin-top:14px}
.read{display:flex;gap:10px;align-items:baseline;font-size:15px}
.read b{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;width:76px;flex:none}
.oku{color:var(--muted)}
.exlist{display:grid;gap:8px;margin-top:8px}
.exrow{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--chip);border-radius:10px}
.exrow .jp{font-size:19px;line-height:1.8;min-width:80px}
.exrow .m{flex:1;font-size:14px;color:var(--muted)}
/* lists */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-top:14px}
.list{display:grid;gap:6px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.row .rw{font-size:19px;line-height:1.8;min-width:96px}
.row .rm{flex:1;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.learning{background:var(--warn)}
.dot.known{background:var(--ok)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;align-items:center;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:14px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile .tk{font-size:32px;line-height:1.2}
.tile .tm{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.tile .dot{position:absolute;top:7px;right:7px}
/* results */
.score{text-align:center;padding:24px 16px}
.score .big{font-size:52px;font-weight:700;letter-spacing:-.03em}
/* settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set b{display:block;font-weight:600}
.set span{font-size:13px;color:var(--muted)}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span:before{transform:translateX(18px)}
textarea{width:100%;min-height:110px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-family:"Noto Sans JP",Inter,sans-serif;margin-top:8px}
code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:13px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:30;display:none}
#sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet .close{float:right;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="logo">語</div><div class="brand">Kotoba Dojo<small>Japanese vocab &amp; kanji trainer</small></div></div></header>
<main id="app"></main>
<nav class="tabs"><div class="in">
  <button data-v="home" onclick="App.go('home')"><b>家</b>Home</button>
  <button data-v="vocab" onclick="App.go('vocab')"><b>語</b>Vocab</button>
  <button data-v="kanji" onclick="App.go('kanji')"><b>字</b>Kanji</button>
  <button data-v="settings" onclick="App.go('settings')"><b>設</b>Settings</button>
</div></nav>
<div id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   DATA
   Vocab: [word, reading, meaning, part of speech, JLPT, frequency 1-5, topic, example, example translation]
   Furigana markup: {漢字|かんじ}
   Frequency: 5 = essential, 4 = very common, 3 = common, 2 = uncommon, 1 = rare
   ========================================================= */
const VOCAB = [
["こんにちは","こんにちは","hello; good afternoon","expression","N5",5,"Basics","こんにちは、{田中|たなか}さん。","Hello, Mr. Tanaka."],
["おはよう","おはよう","good morning","expression","N5",4,"Basics","おはようございます。","Good morning. (polite)"],
["こんばんは","こんばんは","good evening","expression","N5",4,"Basics","こんばんは。お{元気|げんき}ですか。","Good evening. How are you?"],
["ありがとう","ありがとう","thank you","expression","N5",5,"Basics","どうもありがとうございます。","Thank you very much."],
["すみません","すみません","excuse me; sorry","expression","N5",5,"Basics","すみません、{駅|えき}はどこですか。","Excuse me, where is the station?"],
["はい","はい","yes","expression","N5",5,"Basics","はい、そうです。","Yes, that's right."],
["いいえ","いいえ","no","expression","N5",4,"Basics","いいえ、{違|ちが}います。","No, that's wrong."],
["お{願|ねが}いします","おねがいします","please (when requesting)","expression","N5",5,"Basics","{水|みず}をお{願|ねが}いします。","Water, please."],
["{大丈夫|だいじょうぶ}","だいじょうぶ","okay; all right","na-adj","N5",5,"Basics","{大丈夫|だいじょうぶ}ですか。","Are you okay?"],
["{私|わたし}","わたし","I; me","pronoun","N5",5,"People","{私|わたし}は{学生|がくせい}です。","I am a student."],
["{人|ひと}","ひと","person","noun","N5",5,"People","あの{人|ひと}は{誰|だれ}ですか。","Who is that person?"],
["{友達|ともだち}","ともだち","friend","noun","N5",4,"People","{友達|ともだち}と{映画|えいが}を{見|み}ます。","I watch a movie with a friend."],
["{先生|せんせい}","せんせい","teacher","noun","N5",4,"People","{先生|せんせい}に{聞|き}きます。","I'll ask the teacher."],
["{学生|がくせい}","がくせい","student","noun","N5",4,"People","{弟|おとうと}は{学生|がくせい}です。","My younger brother is a student."],
["{家族|かぞく}","かぞく","family","noun","N5",4,"People","{家族|かぞく}は{四人|よにん}です。","There are four people in my family."],
["{子供|こども}","こども","child","noun","N5",4,"People","{子供|こども}が{公園|こうえん}で{遊|あそ}んでいます。","Children are playing in the park."],
["{名前|なまえ}","なまえ","name","noun","N5",4,"People","お{名前|なまえ}は{何|なん}ですか。","What is your name?"],
["{水|みず}","みず","water","noun","N5",5,"Food","{水|みず}を{飲|の}みます。","I drink water."],
["ご{飯|はん}","ごはん","cooked rice; meal","noun","N5",4,"Food","ご{飯|はん}を{食|た}べましょう。","Let's eat."],
["{朝|あさ}ご{飯|はん}","あさごはん","breakfast","noun","N5",3,"Food","{朝|あさ}ご{飯|はん}はパンです。","Breakfast is bread."],
["{肉|にく}","にく","meat","noun","N5",3,"Food","{肉|にく}が{好|す}きです。","I like meat."],
["{鶏肉|とりにく}","とりにく","chicken (meat)","noun","N4",2,"Food","{鶏肉|とりにく}とご{飯|はん}を{食|た}べます。","I eat chicken and rice."],
["{魚|さかな}","さかな","fish","noun","N5",3,"Food","この{魚|さかな}はおいしいです。","This fish is tasty."],
["{卵|たまご}","たまご","egg","noun","N5",3,"Food","{毎朝|まいあさ}{卵|たまご}を{食|た}べます。","I eat eggs every morning."],
["{野菜|やさい}","やさい","vegetables","noun","N5",3,"Food","{野菜|やさい}を{買|か}います。","I buy vegetables."],
["お{茶|ちゃ}","おちゃ","tea; green tea","noun","N5",4,"Food","お{茶|ちゃ}をどうぞ。","Please have some tea."],
["コーヒー","こーひー","coffee","noun","N5",3,"Food","コーヒーを{一|ひと}つください。","One coffee, please."],
["ビール","びーる","beer","noun","N5",3,"Food","ビールはいりません。","I don't need beer."],
["おいしい","おいしい","delicious","i-adj","N5",4,"Food","このラーメンはおいしい!","This ramen is delicious!"],
["{駅|えき}","えき","station","noun","N5",4,"Travel","{駅|えき}はどこですか。","Where is the station?"],
["{電車|でんしゃ}","でんしゃ","train","noun","N5",4,"Travel","{電車|でんしゃ}で{行|い}きます。","I'll go by train."],
["{空港|くうこう}","くうこう","airport","noun","N4",3,"Travel","{空港|くうこう}まで{一時間|いちじかん}かかります。","It takes an hour to get to the airport."],
["{切符|きっぷ}","きっぷ","ticket","noun","N5",2,"Travel","{切符|きっぷ}を{二枚|にまい}ください。","Two tickets, please."],
["ホテル","ほてる","hotel","noun","N5",3,"Travel","ホテルはどこですか。","Where is the hotel?"],
["{地図|ちず}","ちず","map","noun","N5",2,"Travel","{地図|ちず}を{見|み}せてください。","Please show me the map."],
["{右|みぎ}","みぎ","right (direction)","noun","N5",3,"Travel","{右|みぎ}に{曲|ま}がってください。","Please turn right."],
["{左|ひだり}","ひだり","left (direction)","noun","N5",3,"Travel","{左|ひだり}に{銀行|ぎんこう}があります。","There's a bank on the left."],

/* =========================================================

   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KANJI_RE = /[\u3400-\u4dbf\u4e00-\u9fff々]/;
const MARK = /\{([^|}]+)\|([^}]+)\}/g;
const plain = s => String(s).replace(MARK, '$1');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];

const store = {
  get(k, d) { try { const v = localStorage.getItem('kd_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('kd_' + k, JSON.stringify(v)); } catch (e) {} }
};
let settings = Object.assign({ furigana: 'on', romaji: false, autoSpeak: false }, store.get('settings', {}));
let progress = store.get('progress', {});
let custom = store.get('custom', []);

function ruby(s, force) {
  const h = esc(s);
  if (settings.furigana === 'off' && !force) return h.replace(MARK, '$1');
  return h.replace(MARK, '<ruby>$1<rt>$2</rt></ruby>');
}

const ROMA = {あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',を:'o',ん:'n',が:'ga',ぎ:'gi',ぐ:'gu',げ:'ge',ご:'go',ざ:'za',じ:'ji',ず:'zu',ぜ:'ze',ぞ:'zo',だ:'da',ぢ:'ji',づ:'zu',で:'de',ど:'do',ば:'ba',び:'bi',ぶ:'bu',べ:'be',ぼ:'bo',ぱ:'pa',ぴ:'pi',ぷ:'pu',ぺ:'pe',ぽ:'po',ぁ:'a',ぃ:'i',ぅ:'u',ぇ:'e',ぉ:'o',ゔ:'vu'};
const YOON = {ゃ:'ya',ゅ:'yu',ょ:'yo'};
function toRomaji(s) {
  s = String(s).replace(/\./g, '').replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i], n = s[i + 1];
    if (c === 'っ') { const nx = toRomaji(s.slice(i + 1, i + 2)); out += nx && /[a-z]/.test(nx[0]) ? (nx.startsWith('ch') ? 't' : nx[0]) : ''; continue; }
    if (c === 'ー') { const v = out.match(/[aeiou]$/); out += v ? v[0] : ''; continue; }
    let r = ROMA[c];
    if (r === undefined) { out += c === '、' ? ', ' : c; continue; }
    if (n && YOON[n] && r.length > 1) {
      const y = YOON[n];
      if (r === 'shi') r = 'sh' + y[1]; else if (r === 'chi') r = 'ch' + y[1]; else if (r === 'ji') r = 'j' + y[1]; else r = r.slice(0, -1) + y;
      i++;
    }
    out += r;
  }
  return out;
}

function speak(t) {
  try {
    if (!('speechSynthesis' in window)) return toast('Audio not supported in this browser');
    const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('ja')); if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

const FREQ_LABEL = ['', 'Rare', 'Uncommon', 'Common', 'Very common', 'Essential'];
function freqBadge(n, compact) {
  n = Math.max(1, Math.min(5, n | 0));
  let b = ''; for (let i = 1; i <= 5; i++) b += `<i class="${i <= n ? 'on' : ''}"></i>`;
  return `<span class="freq f${n}" title="Frequency: ${FREQ_LABEL[n]}"><span class="bars">${b}</span>${compact ? '' : `<span>${FREQ_LABEL[n]}</span>`}</span>`;
}
const kTier = r => r <= 50 ? 5 : r <= 150 ? 4 : r <= 350 ? 3 : r <= 700 ? 2 : 1;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800); }

/* progress */
function rec(id, ok) { const p = progress[id] || { c: 0, w: 0 }; ok ? p.c++ : p.w++; p.t = Date.now(); progress[id] = p; store.set('progress', progress); }
function status(id) { const p = progress[id]; if (!p) return 'new'; if (p.c >= 3 && p.c >= p.w * 2) return 'known'; return 'learning'; }
function counts(items) { let k = 0, l = 0; items.forEach(i => { const s = status(i.id); if (s === 'known') k++; else if (s === 'learning') l++; }); return { k, l, t: items.length }; }

/* data build */
let V = [], K = [], KMAP = {};
function buildData() {
  V = VOCAB.concat(custom).map(a => ({ id: 'v:' + plain(a[0]), word: a[0], reading: a[1], meaning: a[2], pos: a[3], jlpt: a[4], freq: a[5], cat: a[6], ex: a[7], exEn: a[8] }));
  K = KANJI.map(a => ({ id: 'k:' + a[0], k: a[0], m: a[1], on: a[2], kun: a[3], jlpt: a[4], r: a[5], s: a[6], freq: kTier(a[5]),
    ex: (a[7] || '').split(';').filter(Boolean).map(e => { const [w, r, m] = e.split('|'); return { w, r, m }; }) }));
  KMAP = {}; K.forEach((k, i) => KMAP[k.k] = i);
}
const kRead = x => { const on = x.on.split('、')[0]; const kun = x.kun ? x.kun.split('、')[0].replace(/\.(.+)$/, '($1)') : ''; return kun ? `${on} · ${kun}` : on; };
const kunHtml = kun => kun ? kun.split('、').map(r => { const [a, b] = r.split('.'); return esc(a) + (b ? `<span class="oku">${esc(b)}</span>` : ''); }).join('、') : '—';
const LV_ORDER = ['N5', 'N4', 'N3', 'N2', 'N1', '—'];

let wotd = null;

function vSelection() { return V.filter(x => (S.vf.jlpt === 'All' || x.jlpt === S.vf.jlpt) && (S.vf.cat === 'All' || x.cat === S.vf.cat)); }
function kSorted() { return K.slice().sort((a, b) => a.r - b.r); }
function kSelection() {
  if (S.kf.order === 'freq') { const s = kSorted(); return S.kf.range === 'all' ? s : s.slice(S.kf.range * 25, S.kf.range * 25 + 25); }

function browseList() {
  const q = S.browse.q.trim().toLowerCase();
  let rows = V.map((x, i) => ({ x, i }));
  if (q) rows = rows.filter(({ x }) => plain(x.word).includes(q) || x.reading.includes(q) || toRomaji(x.reading).includes(q) || x.meaning.toLowerCase().includes(q));
  const lv = x => LV_ORDER.indexOf(x.jlpt);
  if (S.browse.sort === 'freq') rows.sort((a, b) => b.x.freq - a.x.freq);
  else if (S.browse.sort === 'jlpt') rows.sort((a, b) => lv(a.x) - lv(b.x) || b.x.freq - a.x.freq);
  else rows.sort((a, b) => a.x.cat.localeCompare(b.x.cat) || b.x.freq - a.x.freq);
  if (!rows.length) return `<p class="muted">No matches.</p>`;
  return rows.map(({ x, i }) => `<button class="row" data-open="v:${i}"><i class="dot ${status(x.id)}"></i><span class="rw jp">${ruby(x.word)}</span><span class="rm">${esc(x.meaning)}</span>${freqBadge(x.freq, true)}</button>`).join('');
}

    <div class="dmean">${esc(x.meaning)}</div>
    <div class="tags"><span class="tag lv">${esc(x.jlpt)}</span><span class="tag">${esc(x.pos)}</span><span class="tag">${esc(x.cat)}</span>${freqBadge(x.freq)}</div>
    ${x.ex ? `<div class="ex"><div style="flex:1"><div class="jp">${ruby(x.ex, true)}</div><div class="en">${esc(x.exEn)}</div></div><button class="say inl" data-say="${esc(plain(x.ex))}" aria-label="Play">🔊</button></div>` : ''}
    ${ks.length ? `<div class="mini">Kanji in this word</div><div class="kchips">${ks.map(c => `<button class="kchip" data-open="k:${KMAP[c]}"><b>${c}</b>${esc(K[KMAP[c]].m.split(';')[0])}</button>`).join('')}</div>` : ''}
    <div class="mini">${p ? `Your record: ${p.c} right · ${p.w} wrong` : 'Not practised yet'}</div>
  </div>`;
}
function kDetail(k) {
  const p = progress[k.id];
  const words = V.map((x, i) => ({ x, i })).filter(({ x }) => plain(x.word).includes(k.k)).slice(0, 4);
  return `<div class="detail force">
    <div class="khead"><div class="kbig jp">${k.k}</div><div><div class="dmean" style="margin-top:0">${esc(k.m)}</div>
      <div class="tags"><span class="tag lv">${k.jlpt}</span><span class="tag">${k.s} strokes</span></div>
      <div>${freqBadge(k.freq)} <span class="muted" style="font-size:12px">· ~#${k.r} most used</span></div></div></div>
    <div class="reads">
      <div class="read"><b>On'yomi</b><span class="jp">${esc(k.on)}</span><span class="muted" style="font-size:13px">${esc(toRomaji(k.on))}</span></div>
      <div class="read"><b>Kun'yomi</b><span class="jp">${kunHtml(k.kun)}</span><span class="muted" style="font-size:13px">${k.kun ? esc(toRomaji(k.kun)) : ''}</span></div>
    </div>
    ${k.ex.length ? `<div class="mini">Examples</div><div class="exlist">${k.ex.map(e => `<div class="exrow"><span class="jp">${ruby(`{${e.w}|${e.r}}`, true)}</span><span class="m">${esc(e.m)}</span><button class="say inl" data-say="${esc(e.r)}" aria-label="Play">🔊</button></div>`).join('')}</div>` : ''}
    ${words.length ? `<div class="mini">In your word list</div><div class="kchips">${words.map(({ x, i }) => `<button class="kchip" data-open="v:${i}"><span class="jp">${esc(plain(x.word))}</span>${esc(x.meaning.split(';')[0])}</button>`).join('')}</div>` : ''}
    <div class="mini">${p ? `Your record: ${p.c} right · ${p.w} wrong` : 'Not practised yet'}</div>
  </div>`;
}
const detail = (kind, item) => kind === 'vocab' ? vDetail(item) : kDetail(item);

/* =========================================================
   QUIZ ENGINE
   ========================================================= */
function distract(item, pool, key, same, n = 3) {
  const k0 = key(item), seen = new Set([k0]), out = [];
  const others = pool.filter(x => x.id !== item.id);
  for (const x of shuffle(others.filter(same)).concat(shuffle(others))) {
    if (out.length >= n) break;
    const kx = key(x); if (!seen.has(kx)) { seen.add(kx); out.push(x); }
  }
  return out;
}
function makeQ(kind, item, dir) {
  if (kind === 'vocab') {
    if (dir === 'jp2en') {
      const opts = shuffle([item, ...distract(item, V, x => x.meaning, x => x.pos === item.pos)]);
      return { item, dir, jp: true, say: item.reading, hint: 'What does this mean?',
        prompt: `<div class="pword jp">${ruby(item.word)}</div>${settings.romaji ? `<div class="proma">${esc(toRomaji(item.reading))}</div>` : ''}`,
        meta: freqBadge(item.freq), grid: false, opts: opts.map(x => ({ html: esc(x.meaning), ok: x === item })) };
    }
    const opts = shuffle([item, ...distract(item, V, x => plain(x.word), x => x.pos === item.pos)]);
    return { item, dir, jp: false, say: item.reading, hint: 'Which word means this?',
      prompt: `<div class="pmean">${esc(item.meaning)}</div>`, meta: freqBadge(item.freq), grid: true,
      opts: opts.map(x => ({ html: `<span class="jp cjp">${ruby(x.word)}</span>${settings.romaji ? `<span class="proma">${esc(toRomaji(x.reading))}</span>` : ''}`, ok: x === item })) };
  }
  const meta = freqBadge(item.freq);
  if (dir === 'm2k') {
    const opts = shuffle([item, ...distract(item, K, x => x.k, x => x.jlpt === item.jlpt)]);
    return { item, dir, jp: false, say: item.ex[0] ? item.ex[0].r : item.k, hint: 'Which kanji has this meaning?',
      prompt: `<div class="pmean">${esc(item.m)}</div>`, meta, grid: true, opts: opts.map(x => ({ html: `<span class="jp ckanji">${x.k}</span>`, ok: x === item })) };
  }
  if (dir === 'k2r') {
    const opts = shuffle([item, ...distract(item, K, kRead, x => x.jlpt === item.jlpt)]);
    return { item, dir, jp: false, say: item.ex[0] ? item.ex[0].r : item.k, hint: 'Which readings belong to this kanji?',
      prompt: `<div class="pkanji jp">${item.k}</div>`, meta, grid: false, opts: opts.map(x => ({ html: `<span class="jp">${esc(kRead(x))}</span>`, ok: x === item })) };
  }
  const opts = shuffle([item, ...distract(item, K, x => x.m, x => x.jlpt === item.jlpt)]);
  return { item, dir, jp: false, say: item.ex[0] ? item.ex[0].r : item.k, hint: 'What does this kanji mean?',
    prompt: `<div class="pkanji jp">${item.k}</div>`, meta, grid: false, opts: opts.map(x => ({ html: esc(x.m), ok: x === item })) };
}
function pickWeighted(pool, recent) {
  const c = pool.filter(x => !recent.includes(x.id)); const list = c.length ? c : pool;
  const w = list.map(x => { const p = progress[x.id]; if (!p) return 3; if (status(x.id) === 'known') return 0.4; return Math.max(1, 2 + p.w - p.c * 0.4); });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) { r -= w[i]; if (r <= 0) return list[i]; }
  return list[list.length - 1];
}
function startLearn(kind) {
  const pool = kind === 'vocab' ? vSelection() : kSelection();
  if (!pool.length) return toast('Nothing selected');
  S.session = { mode: 'learn', kind, pool, dir: kind === 'vocab' ? S.vf.dir : S.kf.qt, seen: 0, correct: 0, streak: 0, recent: [] };
  nextQ();
}
function startTest(items) {
  const kind = S.tf.deck;
  let pool = kind === 'vocab' ? V : K;
  if (S.tf.jlpt !== 'All') pool = pool.filter(x => x.jlpt === S.tf.jlpt);
  if (!pool.length) return toast('Nothing to test');
  S.session = { mode: 'test', kind, pool, queue: items || shuffle(pool).slice(0, S.tf.count), idx: 0, dir: S.tf.dir, results: [] };
  nextQ();
}
function nextQ() {
  const s = S.session; let item;
  if (s.mode === 'test') { if (s.idx >= s.queue.length) { s.done = true; render(); window.scrollTo(0, 0); return; } item = s.queue[s.idx]; }
  else item = pickWeighted(s.pool, s.recent);
  let dir = s.dir;
  if (dir === 'mix') dir = pick(s.kind === 'vocab' ? ['jp2en', 'en2jp'] : ['k2m', 'm2k', 'k2r']);
  s.q = makeQ(s.kind, item, dir); s.answered = false; s.chosen = -1;
  if (s.mode === 'learn') { s.recent.push(item.id); if (s.recent.length > Math.min(4, s.pool.length - 1)) s.recent.shift(); }
  render(); window.scrollTo(0, 0);
  if (settings.autoSpeak && s.q.jp) speak(s.q.say);
}
function answer(i) {
  const s = S.session; if (!s || s.answered || s.done || !s.q.opts[i]) return;
  s.answered = true; s.chosen = i; const ok = s.q.opts[i].ok;
  rec(s.q.item.id, ok);
  if (s.mode === 'learn') { s.seen++; if (ok) { s.correct++; s.streak++; } else s.streak = 0; }
  else s.results.push({ item: s.q.item, ok });
  render();
  if (s.mode === 'learn') { const a = $('.after'); if (a) a.scrollIntoView({ behavior: 'smooth', block: 'start' }); if (settings.autoSpeak && !s.q.jp) speak(s.q.say); }
}
function next() { const s = S.session; if (!s) return; if (s.mode === 'test') s.idx++; nextQ(); }

function renderSession() {
  const s = S.session;
  if (s.done) return renderResults();
  const q = s.q, test = s.mode === 'test';
  const head = test ? `<span>Question ${s.idx + 1} of ${s.queue.length}</span>` : `<span>🔥 ${s.streak} streak · ${s.correct}/${s.seen} correct</span>`;
  const opts = q.opts.map((o, i) => {
    let c = 'choice';
    if (s.answered) c += o.ok ? ' ok' : i === s.chosen ? ' bad' : ' dim';
    return `<button class="${c}" onclick="App.answer(${i})"><span class="n">${i + 1}</span><span>${o.html}</span></button>`;
  }).join('');
  let after = '';
  if (s.answered) {
    const ok = q.opts[s.chosen].ok;
    const last = test && s.idx + 1 >= s.queue.length;
    after = `<div class="verdict ${ok ? 'good' : 'bad'}">${ok ? pick(['正解! Correct', 'いいね! Nice one', 'すごい! Great']) : 'おしい! Not quite — the right answer is highlighted'}</div>
      ${test ? '' : `<div class="card" style="margin-top:12px">${detail(s.kind, q.item)}</div>`}
      <button class="btn" onclick="App.next()">${last ? 'See results' : 'Next'} →</button>`;
  }
  const canSay = q.jp || s.answered;
  return `<div class="qtop"><button class="ghost" onclick="App.endSession()">✕ End</button>${head}</div>
  ${test ? `<div class="qbar"><i style="width:${(s.idx / s.queue.length) * 100}%"></i></div>` : ''}
  <div class="card prompt">${q.prompt}<div class="pmeta">${q.meta}</div>${canSay ? `<button class="say" data-say="${esc(q.say)}" aria-label="Play">🔊</button>` : ''}</div>
  <div class="hint">${q.hint}</div>
  <div class="choices ${q.grid ? 'grid2' : ''}">${opts}</div>
  <div class="after">${after}</div>`;
}
function renderResults() {
  const s = S.session, n = s.results.length, ok = s.results.filter(r => r.ok).length, pct = n ? Math.round(ok / n * 100) : 0;
  const msg = pct >= 90 ? '素晴らしい! Excellent' : pct >= 70 ? 'いいね! Good work' : pct >= 50 ? 'もう少し! Getting there' : 'がんばって! Keep practising';
  const missed = s.results.filter(r => !r.ok);
  const rows = missed.map(({ item: x }) => s.kind === 'vocab'
    ? `<button class="row" data-open="v:${V.indexOf(x)}"><span class="rw jp force">${ruby(x.word, true)}</span><span class="rm">${esc(x.meaning)}</span>${freqBadge(x.freq, true)}</button>`
    : `<button class="row" data-open="k:${KMAP[x.k]}"><span class="rw jp" style="font-size:28px;min-width:44px">${x.k}</span><span class="rm">${esc(x.m)} · <span class="jp">${esc(kRead(x))}</span></span>${freqBadge(x.freq, true)}</button>`).join('');
  return `<div class="card score"><div class="muted">Your score</div><div class="big">${pct}%</div><div>${ok} of ${n} correct</div><div style="margin-top:6px;font-weight:600">${msg}</div></div>
  ${missed.length ? `<div class="label">To review (${missed.length}) — tap for details</div><div class="list">${rows}</div>
  <button class="btn" onclick="App.retry()">Retest my mistakes</button>` : `<p class="note" style="text-align:center">Perfect run — nothing to review.</p>`}
  <button class="btn sec" onclick="App.newTest()">New test</button>
  <button class="btn line" onclick="App.endSession()">Done</button>`;
}

/* =========================================================
   RENDER + ACTIONS
   ========================================================= */
function render() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  $('#app').innerHTML = S.session ? renderSession() : ({ home: vHome, vocab: vVocab, kanji: vKanji, settings: vSettings })[S.view]();
}
function applySettings() { document.body.classList.toggle('furi-tap', settings.furigana === 'tap'); }
function openSheet(kind, idx) {
  const item = kind === 'v' ? V[idx] : K[idx]; if (!item) return;
  $('#sheet').innerHTML = `<div class="sheet-bg" onclick="App.closeSheet()"></div><div class="sheet"><button class="ghost close" onclick="App.closeSheet()" aria-label="Close">✕</button>${detail(kind === 'v' ? 'vocab' : 'kanji', item)}</div>`;
  $('#sheet').classList.add('open');
}

const App = {
  go(v, tab) { S.session = null; S.view = v; if (tab) S.vtab = tab; App.closeSheet(); render(); window.scrollTo(0, 0); },
  vtab(t) { S.vtab = t; render(); },
  vfDir(d) { S.vf.dir = d; render(); }, vfLv(l) { S.vf.jlpt = l; render(); }, vfCat(c) { S.vf.cat = c; render(); },
  tfDeck(d) { S.tf.deck = d; S.tf.dir = 'mix'; S.tf.jlpt = 'All'; render(); }, tfDir(d) { S.tf.dir = d; render(); },
  tfLv(l) { S.tf.jlpt = l; render(); }, tfCount(c) { S.tf.count = +c; render(); },
  bSort(s) { S.browse.sort = s; render(); },
  search(v) { S.browse.q = v; $('#blist').innerHTML = browseList(); },
  kOrder(o) { S.kf.order = o; render(); }, kRange(r) { S.kf.range = r === 'all' ? 'all' : +r; render(); },
  kLv(l) { S.kf.jlpt = l; render(); }, kQt(q) { S.kf.qt = q; render(); },
  startLearn, startTest: () => startTest(), answer, next,
  retry() { const s = S.session; const items = shuffle(s.results.filter(r => !r.ok).map(r => r.item)); S.session = { mode: 'test', kind: s.kind, pool: s.pool, queue: items, idx: 0, dir: s.dir, results: [] }; nextQ(); },
  newTest() { S.session = null; S.view = 'vocab'; S.vtab = 'test'; render(); },
  endSession() { const s = S.session; S.session = null; if (s && s.mode === 'test') { S.view = 'vocab'; S.vtab = 'test'; } render(); window.scrollTo(0, 0); },
  set(k, v) { settings[k] = v; store.set('settings', settings); applySettings(); render(); },
  furi(v) { App.set('furigana', v); },
  addWords() {
    const t = $('#cw').value.trim(); if (!t) return;
    let added = 0;
    t.split(/\n+/).forEach(line => {
      let p;
      if (/\t|;/.test(line)) p = line.split(/\t|;/);
      else { const a = line.split(','); p = a.length > 3 ? [a[0], a[1], a.slice(2).join(',')] : a; }
      p = p.map(s => s.trim());
      const [w, r, m, j] = p; if (!w || !m) return;
      const word = KANJI_RE.test(w) && r && !w.includes('{') ? `{${w}|${r}}` : w;
      custom.push([word, r || w, m, 'custom', (j || '').toUpperCase() || '—', 3, 'My words', '', '']);
      added++;
    });
    store.set('custom', custom); buildData(); toast(added ? `Added ${added} word${added === 1 ? '' : 's'}` : 'Nothing added — check the format'); render();
  },
  clearWords() { if (!confirm('Remove all your custom words?')) return; custom = []; store.set('custom', custom); buildData(); render(); },
  reset() { if (!confirm('Reset all progress? This cannot be undone.')) return; progress = {}; store.set('progress', progress); toast('Progress reset'); render(); },
  closeSheet() { $('#sheet').classList.remove('open'); $('#sheet').innerHTML = ''; }
};

/* delegated taps: audio, detail sheets, tap-to-reveal furigana */
document.addEventListener('click', e => {
  const say = e.target.closest('[data-say]'); if (say) { e.stopPropagation(); speak(say.dataset.say); return; }
  const op = e.target.closest('[data-open]'); if (op) { const [k, i] = op.dataset.open.split(':'); openSheet(k, +i); return; }
  const rb = e.target.closest('ruby'); if (rb && document.body.classList.contains('furi-tap') && !e.target.closest('.choice')) rb.classList.toggle('show');
});
/* keyboard: 1-4 to answer, Enter/Space for next, Esc closes details */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'Escape') return App.closeSheet();
  const s = S.session; if (!s || s.done) return;
  if (/^[1-4]$/.test(e.key) && !s.answered) answer(+e.key - 1);
  else if ((e.key === 'Enter' || e.key === ' ') && s.answered) { e.preventDefault(); next(); }
});

buildData();
applySettings();
(() => { const c = V.map((x, i) => ({ x, i })).filter(({ x }) => x.freq >= 4 && KANJI_RE.test(plain(x.word))); wotd = c.length ? pick(c) : null; })();
if ('speechSynthesis' in window) speechSynthesis.getVoices();
render();
</script>
</body>
