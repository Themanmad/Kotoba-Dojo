<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kotoba Dojo</title>
<meta name="description" content="Learn Japanese vocabulary and kanji (JLPT N5–N1) with flashcards, quizzes, tests, furigana, stroke order and example sentences.">
<meta name="theme-color" content="#faf7f2">
<script>/* apply the saved theme before first paint (no flash) */
try { var t = (JSON.parse(localStorage.getItem('kd_settings') || '{}').theme) || 'system'; if (t !== 'system') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2;--card:#ffffff;--ink:#1d1b19;--muted:#6f675e;--line:#e8e1d7;--chip:#f2ede5;
  --accent:#c8102e;--accent-soft:#fbe9ec;--ok:#1f8a4c;--ok-soft:#e6f5ec;--bad:#c62828;--bad-soft:#fdeceb;
  --warn:#b7791f;--warn-soft:#fbf1df;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141312;--card:#1e1c1a;--ink:#f2ede7;--muted:#a69e94;--line:#34302c;--chip:#292623;
    --accent:#ff5a6e;--accent-soft:#3a1d22;--ok:#4cc483;--ok-soft:#163023;--bad:#ff6b6b;--bad-soft:#3a1b1b;
    --warn:#e2b04a;--warn-soft:#352a14;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141312;--card:#1e1c1a;--ink:#f2ede7;--muted:#a69e94;--line:#34302c;--chip:#292623;
  --accent:#ff5a6e;--accent-soft:#3a1d22;--ok:#4cc483;--ok-soft:#163023;--bad:#ff6b6b;--bad-soft:#3a1b1b;
  --warn:#e2b04a;--warn-soft:#352a14;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
.jp{font-family:"Noto Sans JP",sans-serif}
button{font:inherit;color:inherit}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.logo{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:"Noto Sans JP";font-weight:700;font-size:15px}
.brand{font-weight:700;letter-spacing:-.01em;flex:1}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:-2px}
.streak{font-size:13px;color:var(--muted);white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:7px 0 9px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav.tabs button b{font-family:"Noto Sans JP";font-size:20px;font-weight:500;line-height:1.3}
nav.tabs button.on{color:var(--accent)}
h1{font-size:23px;margin:4px 0 4px;letter-spacing:-.01em}
h1 .muted{font-weight:500}
.sub{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.btn{appearance:none;border:0;background:var(--accent);color:#fff;font-weight:600;padding:13px 18px;border-radius:12px;cursor:pointer;width:100%;font-size:15px;margin-top:14px}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:none;border:1.5px solid var(--bad);color:var(--bad)}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}
.ghost{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 4px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-size:14px;color:var(--muted);cursor:pointer;line-height:1.2}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip small{color:var(--muted);margin-left:3px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on small{color:rgba(255,255,255,.8)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px;font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px}
/* home */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.lvrows{display:grid;gap:10px}
.lvrow{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;font-size:13px}
.lvrow b{font-weight:600}
.pbar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;display:flex}
.pbar i{display:block;height:100%;background:var(--accent)}
.pbar i.l{background:color-mix(in srgb,var(--accent) 35%,var(--chip))}
.actions{display:grid;gap:10px;margin-top:16px}
.action{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.action.hot{border-color:var(--accent)}
.action .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:"Noto Sans JP";font-size:22px;font-weight:700;flex:none}
.action b{display:block}
.action span{font-size:13px;color:var(--muted)}
/* frequency */
.freq{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);vertical-align:middle;white-space:nowrap}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:13px}
.bars i{width:4px;background:var(--line);border-radius:1px}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:11px}.bars i:nth-child(5){height:13px}
.f5 .bars i.on,.f4 .bars i.on{background:var(--accent)}
.f3 .bars i.on{background:var(--warn)}
.f2 .bars i.on,.f1 .bars i.on{background:var(--muted)}
/* ruby */
ruby rt{font-size:.48em;color:var(--muted);font-weight:400}
body.furi-tap ruby:not(.show) rt{visibility:hidden}
body.furi-tap .force ruby rt{visibility:visible}
body.furi-tap .prompt ruby,body.furi-tap .fcard ruby{cursor:pointer}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;color:var(--muted)}
.qbar{height:5px;background:var(--chip);border-radius:99px;overflow:hidden;margin-bottom:12px}
.qbar i{display:block;height:100%;background:var(--accent)}
.prompt{text-align:center;padding:30px 16px 18px;position:relative}
.pword{font-size:42px;font-weight:500;line-height:1.7;word-break:keep-all}
.pkanji{font-size:80px;line-height:1.2;font-weight:500}
.pmean{font-size:22px;font-weight:600;line-height:1.35;padding:10px 0}
.proma{color:var(--muted);font-size:14px;margin-top:-4px;display:block}
.pmeta{margin-top:12px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.say{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px;display:grid;place-items:center}
.say.inl{position:static;width:32px;height:32px;font-size:14px;flex:none}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 4px}
.choices{display:grid;gap:10px;margin-top:10px}
.choices.grid2{grid-template-columns:1fr 1fr}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px;font-size:16px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:56px;transition:border-color .15s,background .15s}
.choice:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.choices.grid2 .choice{flex-direction:column;justify-content:center;gap:4px;text-align:center;min-height:92px}
.choice .n{width:22px;height:22px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none}
.choices.grid2 .choice .n{display:none}
.cjp{font-size:22px;line-height:1.7}
.ckanji{font-size:40px;line-height:1.2}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft)}
.choice.dim{opacity:.5}
.verdict{margin-top:16px;padding:12px 14px;border-radius:12px;font-weight:600}
.verdict.good{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
/* flashcards */
.fcard{text-align:center;padding:36px 16px 24px;position:relative;min-height:230px;display:flex;flex-direction:column;justify-content:center}
.fcard .side{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);position:absolute;top:14px;left:16px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:14px}
.rate small{font-weight:400;color:var(--muted);font-size:11px}
.rate.again{border-color:var(--bad);color:var(--bad)}
.rate.good{border-color:var(--ok);color:var(--ok)}
.rate.easy{border-color:var(--accent);color:var(--accent)}
/* detail */
.detail{margin-top:4px}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dword{font-size:34px;line-height:1.7;font-weight:500}
.dread{color:var(--muted);font-size:14px}
.dmean{font-size:19px;font-weight:600;margin:8px 0}
.senses{margin:8px 0 0;padding-left:22px}
.senses li{margin:4px 0}
.senses .pos{font-size:12px;color:var(--muted);display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.tag{font-size:12px;background:var(--chip);border-radius:6px;padding:3px 8px;color:var(--muted)}
.tag.lv{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.cm{background:var(--ok-soft);color:var(--ok)}
.ex{margin-top:10px;padding:12px;border-radius:12px;background:var(--chip);display:flex;gap:10px;align-items:flex-start}
.ex .jp{font-size:17px;line-height:1.95}
.ex .en{font-size:13px;color:var(--muted)}
.ex .src{font-size:11px;color:var(--muted);text-decoration:none}
.kchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px;text-align:left}
.kchip b{font-family:"Noto Sans JP";font-size:20px;font-weight:500}
.mini{font-size:12px;color:var(--muted);margin-top:12px}
.khead{display:flex;gap:16px;align-items:flex-start}
.kbig{width:120px;height:120px;border-radius:18px;background:var(--chip);display:grid;place-items:center;flex:none;font-size:80px;line-height:1;position:relative;overflow:hidden}
.kbig svg{width:100%;height:100%}
.kbig .replay{position:absolute;bottom:4px;right:4px;border:0;background:var(--card);border-radius:8px;font-size:12px;padding:3px 7px;cursor:pointer;color:var(--muted)}
.ksvg .grid{stroke:var(--line);stroke-width:.6;stroke-dasharray:2 2;fill:none}
.ksvg .bg path{stroke:var(--line);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ksvg .fg path{stroke:var(--ink);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ksvg .nums text{font-size:8px;fill:var(--accent);font-family:Inter,sans-serif}
.frames{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.frames svg{width:44px;height:44px;background:var(--chip);border-radius:6px}
.frames .fg path{stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.frames .fg path.cur{stroke:var(--accent)}
.reads{display:grid;gap:8px;margin-top:14px}
.read{display:flex;gap:10px;align-items:baseline;font-size:15px;flex-wrap:wrap}
.read b{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;width:76px;flex:none}
.oku{color:var(--muted)}
.exlist{display:grid;gap:8px;margin-top:8px}
.exrow{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--chip);border-radius:10px;cursor:pointer;border:0;text-align:left;width:100%}
.exrow .jp{font-size:19px;line-height:1.8;min-width:80px}
.exrow .m{flex:1;font-size:14px;color:var(--muted)}
/* lists */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.list{display:grid;gap:6px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;width:100%}
.row .rw{font-size:19px;line-height:1.8;min-width:96px;max-width:45%}
.row .rm{flex:1;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .lvl{font-size:11px;color:var(--accent);font-weight:600;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;display:inline-block}
.dot.learning{background:var(--warn)}
.dot.known{background:var(--ok)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;align-items:center;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:14px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile .tk{font-size:32px;line-height:1.2}
.tile .tm{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.tile .dot{position:absolute;top:7px;right:7px}
.loading{padding:30px 0;text-align:center;color:var(--muted)}
/* results */
.score{text-align:center;padding:24px 16px}
.score .big{font-size:52px;font-weight:700;letter-spacing:-.03em}
/* settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set b{display:block;font-weight:600}
.set span{font-size:13px;color:var(--muted)}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span:before{transform:translateX(18px)}
textarea{width:100%;min-height:110px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-family:"Noto Sans JP",Inter,sans-serif;margin-top:8px}
code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:13px}
.credits{font-size:13px;display:grid;gap:8px}
.credits div{color:var(--muted)}
.credits b{color:var(--ink);font-weight:600}
/* sheet */
#sheet{position:fixed;inset:0;z-index:30;display:none}
#sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet .close{float:right;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.qnav{display:flex;gap:6px;align-items:center}
.backbtn{color:var(--ink);font-weight:500}
.themebtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:15px;display:grid;place-items:center;flex:none;padding:0}
.simlist{display:grid;gap:6px;margin-top:8px}
.simrow{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer}
.simrow .sk{font-size:30px;line-height:1.2;width:40px;text-align:center;flex:none}
.simrow .sm{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px}
.simrow .sm span{font-size:12px;color:var(--muted)}
.simrow .lvl{font-size:11px;color:var(--accent);font-weight:600;flex:none}
@media (min-width:900px){ header.top .themebtn{position:absolute;right:14px;top:22px} header.top .in{padding-right:56px} }
/* word of the day */
.wotd{margin-top:16px}
.wotd .wk{display:flex;justify-content:space-between;align-items:center;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.wotd .w{font-size:34px;line-height:1.7;font-weight:500}
.wotd .wm{font-size:15px}
.wotd .btnrow .btn{margin-top:12px}
.page{max-width:760px;margin:0 auto}
.page-home,.page-kanji{max-width:none}
.kbd{display:none}
@media (hover:hover) and (pointer:fine){.kbd{display:block}}

/* ---------- tablet ---------- */
@media (min-width:600px){
  main{padding:20px 24px}
  .pword{font-size:48px}
  .choices:not(.grid2){grid-template-columns:1fr 1fr}
}
/* ---------- desktop: sidebar navigation, wider grids, centred dialogs ---------- */
@media (min-width:900px){
  body{padding-bottom:32px;padding-left:236px}
  header.top{position:fixed;left:0;top:0;width:236px;background:none;backdrop-filter:none;border-bottom:0;z-index:11}
  header.top .in{padding:20px 18px;max-width:none}
  header.top .streak{display:none}
  nav.tabs{top:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);padding:84px 12px 16px}
  nav.tabs .in{flex-direction:column;gap:4px;max-width:none}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 14px;border-radius:12px;font-size:15px;font-weight:500;color:var(--ink)}
  nav.tabs button b{font-size:19px;width:24px;text-align:center;color:var(--muted)}
  nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
  nav.tabs button.on b{color:var(--accent)}
  nav.tabs button:hover:not(.on){background:var(--chip)}
  main{max-width:1120px;padding:32px 40px}
  h1{font-size:28px}
  .home-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
  .home-side>.label:first-child{margin-top:16px}
  .page-session{max-width:720px}

function furi(surface, reading) {
  if (!reading || ![...surface].some(isK)) return surface;
  const hr = kata2hira(reading), segs = [];
  for (const ch of surface) { const k = isK(ch); const l = segs[segs.length - 1]; if (l && l.k === k) l.t += ch; else segs.push({ k, t: ch }); }
  const m = new RegExp('^' + segs.map(s => s.k ? '(.+?)' : reEsc(kata2hira(s.t))).join('') + '$').exec(hr);
  if (!m) return `{${surface}|${hr}}`;
  let g = 1; return segs.map(s => s.k ? `{${s.t}|${m[g++]}}` : s.t).join('');
}
function ruby(s, force) {

function toRomaji(s) {
  s = String(s).replace(/[.\-]/g, '').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i], n = s[i + 1];
    if (c === 'っ') { const nx = toRomaji(s.slice(i + 1, i + 2)); out += nx && /[a-z]/.test(nx[0]) ? (nx.startsWith('ch') ? 't' : nx[0]) : ''; continue; }

    let r = ROMA[c];
    if (r === undefined) { out += c === '、' ? ', ' : c; continue; }
    if (n && YOON[n] && r.length > 1 && r.endsWith('i')) {
      const y = YOON[n];
      if (r === 'shi') r = 'sh' + y[1]; else if (r === 'chi') r = 'ch' + y[1]; else if (r === 'ji') r = 'j' + y[1]; else r = r.slice(0, -1) + y;

    out += r;
  }

}

const isLoaded = (kind, l) => l === 'MY' || !!DATA[kind][l];
function loadSel() { return Promise.all(settings.levels.map(l => load('vocab', l))); }

function rebuild() {

const levelTotal = (kind, l) => l === 'MY' ? custom.length : (DATA.mode === 'full' ? ((DATA.meta.counts || {})[kind] || {})[l] || 0 : (DATA[kind][l] || []).length);

/* =====================================================================
   PROGRESS / SPACED REPETITION
   box → interval in days. A word counts as "known" from box 4 (14-day interval).
   ===================================================================== */

const KNOWN_BOX = 4;

const isDue = (id, now = Date.now()) => { const p = progress[id]; return !!p && (p.d || 0) <= now; };

function logAct(newCard, kind) { const d = today(); const e = actLog[d] || { r: 0 }; e.r = (e.r || 0) + 1; if (newCard) { const k = kind === 'kanji' ? 'nk' : 'nv'; e[k] = (e[k] || 0) + 1; } actLog[d] = e; store.set('log', actLog); }
const todayLog = () => actLog[today()] || { r: 0 };
const newLeft = kind => Math.max(0, settings.newPerDay - (todayLog()[kind === 'kanji' ? 'nk' : 'nv'] || 0));
function streak() {
  let n = 0; const d = new Date();
  if (!actLog[today()]) d.setDate(d.getDate() - 1);
  for (;;) { const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; if (actLog[k] && actLog[k].r) { n++; d.setDate(d.getDate() - 1); } else break; }

}
/** Quiz / test answers. Correct answers only advance the schedule when the item is due (or new). */
function rec(item, ok) {
  const now = Date.now(), isNew = !progress[item.id];
  const p = progress[item.id] || { c: 0, w: 0, b: 0, d: 0 };
  p.b = box(p); p.l = item.lvl;
  if (ok) { p.c++; if (isNew || now >= (p.d || 0)) { p.b = Math.min(IV.length - 1, p.b + 1); p.d = now + IV[p.b] * DAY; } }
  else { p.w++; p.b = Math.max(0, p.b - 2); p.d = now + 10 * 60e3; }
  p.t = now; progress[item.id] = p; save(); logAct(false, item.kind);
}
/** Flashcard grades: 0 again, 1 hard, 2 good, 3 easy. */
function schedule(item, g, dry) {
  const now = Date.now(), p0 = progress[item.id];
  const p = Object.assign({ c: 0, w: 0, b: 0, d: 0 }, p0 || {}); p.b = p0 ? box(p0) : 0;
  let due;
  if (g === 0) { p.w++; p.b = Math.max(0, p.b - 2); due = now + 60e3; }
  else if (g === 1) { p.c++; p.b = Math.max(1, p.b); due = now + Math.max(0.5, IV[p.b] * 0.5) * DAY; }
  else { p.c++; p.b = Math.min(IV.length - 1, p.b + (g === 3 ? 2 : 1)); due = now + IV[p.b] * DAY; }
  if (dry) return due - now;
  p.d = due; p.t = now; p.l = item.lvl; progress[item.id] = p; save(); logAct(!p0, item.kind);
}
const fmtIv = ms => ms < 3600e3 ? `${Math.max(1, Math.round(ms / 60e3))}m` : ms < DAY ? `${Math.round(ms / 3600e3)}h` : ms < 30 * DAY ? `${Math.round(ms / DAY)}d` : `${Math.round(ms / (30 * DAY))}mo`;
function levelStats(kind, l) {
  const pre = kind === 'vocab' ? 'v:' : 'k:'; let k = 0, n = 0;
  for (const [id, p] of Object.entries(progress)) if (id.startsWith(pre) && p.l === l) { n++; if (box(p) >= KNOWN_BOX) k++; }

function dueCount() { const now = Date.now(); return Object.values(progress).filter(p => (p.d || 0) <= now).length; }

/* ---------- word of the day ----------
   Picks from the level you're working on: the easiest selected JLPT level
   where you know under 90% of the words. Same word all day (saved), prefers
   common words you haven't studied yet that have an example sentence. */
function userLevel() {
  const sel = LV.filter(l => settings.levels.includes(l) && levelTotal('vocab', l));
  if (!sel.length) return LV.find(l => DATA.vocab[l] && DATA.vocab[l].length) || 'N5';
  for (const l of sel) { const st = levelStats('vocab', l); if (!st.total || st.known / st.total < 0.9) return l; }
  return sel[sel.length - 1];

  const words = DATA.vocab[l] || []; if (!words.length) return null;
  const tiers = [x => status(x.id) === 'new' && x.freq >= 3 && x.ex.length, x => status(x.id) === 'new' && x.freq >= 3, x => status(x.id) !== 'known', () => true];
  let pool = [];
  for (const t of tiers) { pool = words.filter(t); if (pool.length) break; }
  pool.sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);

    <div class="wk"><span>Word of the day</span><span class="tag lv">${l}</span></div>
    <div class="dtop"><div class="w jp">${ruby(x.f, true)}</div><button class="say inl" data-say="${esc(x.r)}" aria-label="Play">🔊</button></div>
    <div class="wm"><b>${esc(x.m)}</b> <span class="muted">· ${esc(x.r)} · ${esc(toRomaji(x.r))}</span></div>

function searchResults() {
  const q0 = S.search.q.trim(); if (!q0) return `<p class="note">Tip: type romaji like <code>arigatou</code> or a single kanji to see words that use it.</p>`;
  if (S.search.busy) return '<div class="loading">Loading all levels…</div>';
  const q = q0.toLowerCase(), jp = /[぀-ヿ㐀-鿿]/.test(q0), qh = kata2hira(q0);
  const wordRe = new RegExp(`\\b${reEsc(q)}\\b`);
  const scored = [];
  for (const x of V) {
    let s = 0;
    if (jp) {
      const forms = [x.w, x.alt, x.r].filter(Boolean);
      if (forms.includes(q0) || kata2hira(x.r) === qh) s = 100;
      else if (forms.some(f => f.startsWith(q0)) || kata2hira(x.r).startsWith(qh)) s = 60;
      else if (forms.some(f => f.includes(q0))) s = 30;
    } else {
      const rom = x._rom || (x._rom = toRomaji(x.r));
      const gl = x._gl || (x._gl = x.senses.flatMap(s => s.g).map(g => g.toLowerCase()));
      const bare = gl.map(g => g.replace(/^to /, '').replace(/\s*\(.*?\)\s*/g, ' ').trim());
      if (rom === q) s = 95;
      else if (gl.includes(q) || bare.includes(q)) s = 90;
      else if (rom.startsWith(q) && q.length >= 2) s = 50;
      else if (gl.some(g => wordRe.test(g))) s = 40;

  if (s.done) return;
  if (s.mode === 'cards') {
    if ((e.key === ' ' || e.key === 'Enter') && !s.flipped) { e.preventDefault(); flip(); }
    else if (/^[1-4]$/.test(e.key) && s.flipped) rate(+e.key - 1);
    else if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'z') { e.preventDefault(); back(); }
    return;
  }
  if (/^[1-4]$/.test(e.key) && !s.answered) answer(+e.key - 1);
  else if ((e.key === 'Enter' || e.key === ' ') && s.answered) { e.preventDefault(); next(); }
});

applySettings();
if ('speechSynthesis' in window) speechSynthesis.getVoices();
boot().then(render, err => { console.error(err); render(); });
</script>
