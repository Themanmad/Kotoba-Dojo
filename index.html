<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kotoba Dojo</title>
<meta name="description" content="Learn Japanese vocabulary and kanji (JLPT N5–N1) with flashcards, quizzes, tests, furigana, stroke order and example sentences.">
<meta name="theme-color" content="#F5F7F6">
<script>/* apply the saved theme before first paint (no flash) */
try { var st = JSON.parse(localStorage.getItem('kd_settings') || '{}'), t = st.theme || 'system'; if (t !== 'system') document.documentElement.setAttribute('data-theme', t); if (st.skin && st.skin !== 'washi') document.documentElement.setAttribute('data-skin', st.skin); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600;700&family=M+PLUS+1+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2;--card:#ffffff;--ink:#1d1b19;--muted:#6f675e;--line:#e8e1d7;--chip:#f2ede5;
  --accent:#c8102e;--accent-soft:#fbe9ec;--ok:#1f8a4c;--ok-soft:#e6f5ec;--bad:#c62828;--bad-soft:#fdeceb;
  --warn:#b7791f;--warn-soft:#fbf1df;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141312;--card:#1e1c1a;--ink:#f2ede7;--muted:#a69e94;--line:#34302c;--chip:#292623;
    --accent:#ff5a6e;--accent-soft:#3a1d22;--ok:#4cc483;--ok-soft:#163023;--bad:#ff6b6b;--bad-soft:#3a1b1b;
    --warn:#e2b04a;--warn-soft:#352a14;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141312;--card:#1e1c1a;--ink:#f2ede7;--muted:#a69e94;--line:#34302c;--chip:#292623;
  --accent:#ff5a6e;--accent-soft:#3a1d22;--ok:#4cc483;--ok-soft:#163023;--bad:#ff6b6b;--bad-soft:#3a1b1b;
  --warn:#e2b04a;--warn-soft:#352a14;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
.jp{font-family:"Noto Sans JP",sans-serif}
button{font:inherit;color:inherit}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.logo{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:"Noto Sans JP";font-weight:700;font-size:15px}
.brand{font-weight:700;letter-spacing:-.01em;flex:1}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:-2px}
.streak{font-size:13px;color:var(--muted);white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:7px 0 9px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav.tabs button b{font-family:"Noto Sans JP";font-size:20px;font-weight:500;line-height:1.3}
nav.tabs button.on{color:var(--accent)}
h1{font-size:23px;margin:4px 0 4px;letter-spacing:-.01em}
h1 .muted{font-weight:500}
.sub{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.btn{appearance:none;border:0;background:var(--accent);color:#fff;font-weight:600;padding:13px 18px;border-radius:12px;cursor:pointer;width:100%;font-size:15px;margin-top:14px}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:none;border:1.5px solid var(--bad);color:var(--bad)}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}
.ghost{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 4px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-size:14px;color:var(--muted);cursor:pointer;line-height:1.2}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip small{color:var(--muted);margin-left:3px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on small{color:rgba(255,255,255,.8)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px;font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px}
/* home */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.lvrows{display:grid;gap:10px}
.lvrow{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;font-size:13px}
.lvrow b{font-weight:600}
.pbar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;display:flex}
.pbar i{display:block;height:100%;background:var(--accent)}
.pbar i.l{background:color-mix(in srgb,var(--accent) 35%,var(--chip))}
.actions{display:grid;gap:10px;margin-top:16px}
.action{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.action.hot{border-color:var(--accent)}
.action .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:"Noto Sans JP";font-size:22px;font-weight:700;flex:none}
.action b{display:block}
.action span{font-size:13px;color:var(--muted)}
/* frequency */
.freq{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);vertical-align:middle;white-space:nowrap}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:13px}
.bars i{width:4px;background:var(--line);border-radius:1px}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:11px}.bars i:nth-child(5){height:13px}
.f5 .bars i.on,.f4 .bars i.on{background:var(--accent)}
.f3 .bars i.on{background:var(--warn)}
.f2 .bars i.on,.f1 .bars i.on{background:var(--muted)}
/* ruby */
ruby rt{font-size:.55em;color:color-mix(in srgb,var(--ink) 72%,transparent);font-weight:500;letter-spacing:.02em}
body.furi-tap ruby:not(.show) rt{visibility:hidden}
body.furi-tap .force ruby rt{visibility:visible}
body.furi-tap .prompt ruby,body.furi-tap .fcard ruby{cursor:pointer}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;color:var(--muted)}
.qbar{height:5px;background:var(--chip);border-radius:99px;overflow:hidden;margin-bottom:12px}
.qbar i{display:block;height:100%;background:var(--accent)}
.prompt{text-align:center;padding:30px 16px 18px;position:relative}
.pword{font-size:42px;font-weight:500;line-height:1.7;word-break:keep-all}
.pkanji{font-size:80px;line-height:1.2;font-weight:500}
.pmean{font-size:22px;font-weight:600;line-height:1.35;padding:10px 0}
.proma{color:var(--muted);font-size:16px;margin-top:10px;display:block}
.pmeta{margin-top:12px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.say{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px;display:grid;place-items:center}
.say.inl{position:static;width:32px;height:32px;font-size:14px;flex:none}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 4px}
.choices{display:grid;gap:10px;margin-top:10px}
.choices.grid2{grid-template-columns:1fr 1fr}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px;font-size:16px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:56px;transition:border-color .15s,background .15s}
.choice:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.choices.grid2 .choice{flex-direction:column;justify-content:center;gap:4px;text-align:center;min-height:92px}
.choice .n{width:22px;height:22px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none}
.choices.grid2 .choice .n{display:none}
.cjp{font-size:22px;line-height:1.7}
.ckanji{font-size:40px;line-height:1.2}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft)}
.choice.dim{opacity:.5}
.verdict{margin-top:16px;padding:12px 14px;border-radius:12px;font-weight:600}
.verdict.good{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
/* flashcards */
.fcard{text-align:center;padding:36px 16px 24px;position:relative;min-height:230px;display:flex;flex-direction:column;justify-content:center}
.fcard .side{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);position:absolute;top:14px;left:16px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:14px}
.rate small{font-weight:400;color:var(--muted);font-size:11px}
.rate.again{border-color:var(--bad);color:var(--bad)}
.rate.good{border-color:var(--ok);color:var(--ok)}
.rate.easy{border-color:var(--accent);color:var(--accent)}
/* detail */
.detail{margin-top:4px}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dword{font-size:34px;line-height:1.7;font-weight:500}
.dread{color:var(--muted);font-size:14px}
.dmean{font-size:19px;font-weight:600;margin:8px 0}
.senses{margin:8px 0 0;padding-left:22px}
.senses li{margin:4px 0}
.senses .pos{font-size:12px;color:var(--muted);display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.tag{font-size:12px;background:var(--chip);border-radius:6px;padding:3px 8px;color:var(--muted)}
.tag.lv{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.cm{background:var(--ok-soft);color:var(--ok)}
.ex{margin-top:10px;padding:12px;border-radius:12px;background:var(--chip);display:flex;gap:10px;align-items:flex-start}
.ex .jp{font-size:17px;line-height:1.95}
.ex .en{font-size:13px;color:var(--muted)}
.ex .src{font-size:11px;color:var(--muted);text-decoration:none}
.kchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px;text-align:left}
.kchip b{font-family:"Noto Sans JP";font-size:20px;font-weight:500}
.mini{font-size:12px;color:var(--muted);margin-top:12px}
.khead{display:flex;gap:16px;align-items:flex-start}
.kbig{width:120px;height:120px;border-radius:18px;background:var(--chip);display:grid;place-items:center;flex:none;font-size:80px;line-height:1;position:relative;overflow:hidden}
.kbig svg{width:100%;height:100%}
.kbig .replay{position:absolute;bottom:4px;right:4px;border:0;background:var(--card);border-radius:8px;font-size:12px;padding:3px 7px;cursor:pointer;color:var(--muted)}
.ksvg .grid{stroke:var(--line);stroke-width:.6;stroke-dasharray:2 2;fill:none}
.ksvg .bg path{stroke:var(--line);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ksvg .fg path{stroke:var(--ink);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ksvg .nums text{font-size:8px;fill:var(--accent);font-family:Inter,sans-serif}
.frames{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.frames svg{width:44px;height:44px;background:var(--chip);border-radius:6px}
.frames .fg path{stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.frames .fg path.cur{stroke:var(--accent)}
.reads{display:grid;gap:8px;margin-top:14px}
.read{display:flex;gap:10px;align-items:baseline;font-size:15px;flex-wrap:wrap}
.read b{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;width:76px;flex:none}
.oku{color:var(--muted)}
.exlist{display:grid;gap:8px;margin-top:8px}
.exrow{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--chip);border-radius:10px;cursor:pointer;border:0;text-align:left;width:100%}
.exrow .jp{font-size:19px;line-height:1.8;min-width:80px}
.exrow .m{flex:1;font-size:14px;color:var(--muted)}
/* lists */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.list{display:grid;gap:6px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;width:100%}
.row .rw{font-size:19px;line-height:1.8;min-width:96px;max-width:45%}
.row .rm{flex:1;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .lvl{font-size:11px;color:var(--accent);font-weight:600;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;display:inline-block}
.dot.learning{background:var(--warn)}
.dot.known{background:var(--ok)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;align-items:center;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:14px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile .tk{font-size:32px;line-height:1.2}
.tile .tm{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.tile .dot{position:absolute;top:7px;right:7px}
.loading{padding:30px 0;text-align:center;color:var(--muted)}
/* results */
.score{text-align:center;padding:24px 16px}
.score .big{font-size:52px;font-weight:700;letter-spacing:-.03em}
/* settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set b{display:block;font-weight:600}
.set span{font-size:13px;color:var(--muted)}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span:before{transform:translateX(18px)}
textarea{width:100%;min-height:110px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-family:"Noto Sans JP",Inter,sans-serif;margin-top:8px}
code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:13px}
.credits{font-size:13px;display:grid;gap:8px}
.credits div{color:var(--muted)}
.credits b{color:var(--ink);font-weight:600}
/* sheet */
#sheet{position:fixed;inset:0;z-index:30;display:none}
#sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet .close{font-size:18px;margin-left:auto}
.sheet-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-6px -6px 4px}
.sheet-back{font-size:15px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:10px;max-width:70%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sheet-back:hover{background:var(--chip)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.qnav{display:flex;gap:6px;align-items:center}
.vtabs .seg button{font-size:13px;padding:9px 2px}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kcell{position:relative;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-height:66px;justify-content:center}
.kcell.empty{border:0;background:none;cursor:default}
.kcell .kc{font-size:26px;line-height:1.2}
.kcell .ko{font-size:13px;color:var(--muted);line-height:1.2}
.kcell .kr{font-size:11px;color:var(--muted)}
.kcell .dot{position:absolute;top:6px;right:6px}
.sitgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.sitcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;cursor:pointer;box-shadow:var(--shadow)}
.sitcard .si{font-size:26px;line-height:1.2;margin-bottom:4px}
.sitcard b{font-size:15px}
.sitcard .sj{font-size:13px;color:var(--muted)}
.sitcard .sm{font-size:12px;color:var(--muted);margin:4px 0 6px}
.sitcard .pbar{width:100%;height:5px}
.row .rank{font-size:12px;color:var(--muted);width:20px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
@media (min-width:900px){ .sitgrid{grid-template-columns:repeat(3,1fr)} .kgrid{gap:8px} .kcell{min-height:78px} .kcell .kc{font-size:30px} }
.verdict{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vplay{border:0;background:var(--card);color:inherit;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;flex:none}
.nav-extra{display:none!important}
.nav-foot{display:none;margin-top:auto;padding:14px 16px 6px;border-top:1px solid var(--line)}
.nav-foot .nf-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:12px}
.nav-foot .nf-head i{width:12px;height:12px;border-radius:50%;background:var(--lc)}
.nav-foot .nf-row{display:grid;grid-template-columns:66px 1fr 40px;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin:8px 0}
.nav-foot .nf-bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}

.ak-deck{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ak-deck div{display:flex;flex-direction:column}
.ak-deck span{font-size:13px;color:var(--muted)}
.ak-sum{display:flex;flex-direction:column;gap:4px}
.ak-sum span{font-size:14px;color:var(--muted)}
.note.warn{color:var(--bad)}
.ak-note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;color:var(--ink)}
.unit.known{opacity:.6}
.kps{margin:12px 0 16px}
.kps-row{display:flex;align-items:center;gap:6px}
.kps figure{margin:0;flex:1;max-width:124px}
.kps svg{width:100%;height:auto;display:block;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.kps-a{color:var(--muted);font-size:18px;flex:none}
.kps-cap{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;margin-top:8px;line-height:1.4}
.kps-tag{color:var(--accent);font-weight:700}
.kps-play{flex:none;font-size:13px;white-space:nowrap}
.kps.play .kps-mid .kps-art{animation:kpArt 2.8s ease forwards}
.kps.play .kps-mid .kps-g{animation:kpG 2.8s ease forwards}
@keyframes kpArt{0%,45%{opacity:1}100%{opacity:.3}}
@keyframes kpG{0%,30%{opacity:0}100%{opacity:1}}
.kps.sm{margin:4px 0 10px}
.kps.sm figure{max-width:72px}
.kps.sm .kps-play{display:none}
.kps.sm .kps-cap{font-size:12.5px;margin-top:4px}
@media (prefers-reduced-motion:reduce){.kps.play .kps-mid .kps-art,.kps.play .kps-mid .kps-g{animation:none}}
.lw-known{font-size:11px;font-weight:700;color:var(--ok)}
.dnote{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.dnote b{margin-right:6px}
.dnote span{display:block;margin-top:4px;color:var(--muted)}
.pic.dpic{border-radius:12px;background:#fff;object-fit:contain}
.kc-hint{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.kcx.kc-sel{background:var(--accent-soft);color:var(--accent);text-decoration:none}
::highlight(kp-word){background-color:var(--accent-soft);color:var(--accent)}
.has-hl .kcx.kc-sel{background:none}
.kpop{position:fixed;z-index:60;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(10,20,40,.22);padding:10px;animation:kpop .14s ease-out}
@keyframes kpop{from{opacity:0;transform:translateY(-4px)}}
.kpop.above{animation-name:kpopup}
@keyframes kpopup{from{opacity:0;transform:translateY(4px)}}
.kp-load{padding:8px 6px;color:var(--muted);font-size:14px}
.kp-word{display:grid;grid-template-columns:1fr auto;grid-template-areas:"w go" "m go";align-items:center;gap:2px 10px;width:100%;text-align:left;background:var(--accent-soft);border:0;border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit}
.kp-word.static{background:var(--chip);cursor:default}
.kp-word:hover{filter:brightness(.97)}
.kp-w{grid-area:w;font-size:24px;font-weight:700;line-height:1.5}
.kp-m{grid-area:m;font-size:14px;color:var(--muted);line-height:1.35}
.kp-go{grid-area:go;font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.kp-note{font-size:12.5px;color:var(--muted);margin:6px 4px 0}
.kp-label{font-size:12px;font-weight:700;color:var(--muted);margin:10px 4px 6px}
.kp-kanji{display:flex;flex-wrap:wrap;gap:6px}
.kp-kanji button{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:10px;padding:5px 10px 5px 6px;cursor:pointer;color:var(--ink);font:inherit;font-size:13px;max-width:100%}
.kp-kanji button b{font-size:22px;font-weight:600;line-height:1.2;min-width:26px;text-align:center}
.kp-kanji button span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.kp-kanji button.on{border-color:var(--accent)}
.kp-kanji button:hover,.kpop button:focus-visible{background:var(--chip);outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.kpop{animation:none}}
.pic-credit{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
.kpic .pic-credit{display:block;text-align:left}
/* dark mode: pictures sit on a light tile so their black outlines and ink-coloured icons stay visible */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) img.pic:not(.p3d):not(.icon){background:#EDF0F5;border-radius:22%;padding:.1em;box-sizing:border-box} }
:root[data-theme="dark"] img.pic:not(.p3d):not(.icon){background:#EDF0F5;border-radius:22%;padding:.1em;box-sizing:border-box}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) img.pic:is(.xs,.sm){padding:1px;border-radius:6px} }
:root[data-theme="dark"] img.pic:is(.xs,.sm){padding:1px;border-radius:6px}
.page-home .pic-credit{display:none}
.quote{margin:0;border-radius:var(--r-sign,12px);background:var(--card);border:1px solid var(--line);padding:18px 18px 12px;position:relative;border-left:6px solid var(--yellow,var(--accent))}
.quote .qj{margin:0;font-size:22px;line-height:2.05;font-weight:700}
.quote .qe{margin:6px 0 10px;font-size:16px;line-height:1.5}
.quote figcaption{font-size:14px;font-weight:600;color:var(--ink)}
.quote .qsrc{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.quote .qcopy{font-size:12px;color:var(--muted);margin:8px 0 0}
.quote .qnote{font-size:13px;color:var(--muted);margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
.quote .qnext{font-size:13px;font-weight:600;color:var(--accent);padding:8px 0 0}
.lcdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
/* neat grammar */
.gpat{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px;font-weight:600;color:var(--ink)}
.gnote{display:block;font-size:12px;font-weight:400;color:var(--muted);font-family:Inter,sans-serif;margin-top:2px;line-height:1.3}
.gtil{display:inline-block;width:.9em;height:.9em;border:1.5px dashed var(--muted);border-radius:4px;margin:0 2px;vertical-align:middle;opacity:.7}
.ggap{display:inline-block;width:1.4em;border-bottom:2px dotted var(--muted);margin:0 4px;align-self:center;height:.5em}
.gsep{color:var(--muted);margin:0 4px;font-weight:400}
.gplus{color:var(--muted);margin:0 4px;font-weight:400}
.gtitle .gpat{font-size:30px;line-height:1.4}
.gtitle .gnote{font-size:14px}
.row .rw.gt{min-width:120px;max-width:50%}
.exrev .exs{line-height:2}
.psent ruby rt{font-size:max(15px,.5em)}
.row .rw.gt .gpat{font-size:18px;line-height:1.4}
.pword.gq .gpat{font-size:36px;justify-content:center}
.cjp .gpat{font-size:20px;justify-content:center}
.cjp .gpat.long{font-size:16px}
.pword.gq .gpat.long{font-size:28px}
.gform{margin-top:12px;padding:12px;border-radius:12px;background:var(--chip);border:0}
.gfline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.gfc{border-radius:8px;padding:4px 10px;font-size:14px;line-height:1.4}
.gfw{background:var(--card);border:1px solid var(--line);color:var(--muted)}
.gfj{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:16px}
.gfm{background:var(--card);border:1px solid var(--accent);color:var(--ink)}
.gfplus{color:var(--muted);font-weight:600}
.gexpl{font-size:14px;line-height:1.65;margin-top:12px}
.gexpl p{margin:0 0 8px}
.gin{font-weight:600;color:var(--accent)}
mark.gp{background:none;color:var(--accent);font-weight:700;border-bottom:2px solid var(--accent);padding:0 1px}
mark.gp rt{color:var(--accent)}
.seclist{display:grid;gap:6px;margin-top:14px}
.secrow{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px 10px 28px;cursor:pointer}
.secrow.part{padding-left:14px;margin-top:8px;border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.secrow>span:first-child{display:flex;flex-direction:column}
.secrow b{font-weight:600}
.secrow span span{font-size:12px;color:var(--muted)}
.secrow .go{font-size:13px;color:var(--accent);font-weight:600;flex:none}
.lvrows.wide .lvrow{grid-template-columns:96px 1fr auto}
.score .big.okc,.score .big.badc{font-family:"Noto Sans JP",sans-serif}
.exrev .rm{display:block;-webkit-line-clamp:unset;color:var(--ink)}
.backbtn{color:var(--ink);font-weight:500}
.themebtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:15px;display:grid;place-items:center;flex:none;padding:0}
.simlist{display:grid;gap:6px;margin-top:8px}
.simrow{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer}
.simrow .sk{font-size:30px;line-height:1.2;width:40px;text-align:center;flex:none}
.simrow .sm{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px}
.simrow .sm span{font-size:12px;color:var(--muted)}
.simrow .lvl{font-size:11px;color:var(--accent);font-weight:600;flex:none}
@media (min-width:900px){ header.top .themebtn{position:absolute;right:14px;top:22px} header.top .in{padding-right:56px} .hdr-extra{display:none!important} .nav-extra{display:flex!important} }
/* word of the day */
.wotd{margin-top:16px}
.wotd .wk{display:flex;justify-content:space-between;align-items:center;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.wotd .w{font-size:34px;line-height:1.7;font-weight:500}
.wotd .wm{font-size:15px}
.wotd .btnrow .btn{margin-top:12px}
.page{max-width:760px;margin:0 auto}
.page-home,.page-kanji{max-width:none}
.kbd{display:none}
@media (hover:hover) and (pointer:fine){.kbd{display:block}}

/* ---------- tablet ---------- */
@media (min-width:600px){
  main{padding:20px 24px}
  .pword{font-size:48px}
  .choices:not(.grid2){grid-template-columns:1fr 1fr}
}
/* ---------- desktop: sidebar navigation, wider grids, centred dialogs ---------- */
@media (min-width:900px){
  body{padding-bottom:32px;padding-left:260px}
  header.top{position:fixed;left:0;top:0;width:260px;background:none;backdrop-filter:none;border-bottom:0;z-index:11}
  header.top .in{padding:20px 18px;max-width:none}
  header.top .streak{display:none}
  nav.tabs{top:0;right:auto;width:260px;border-top:0;border-right:1px solid var(--line);padding:84px 12px 16px}
  nav.tabs .in{flex-direction:column;gap:4px;max-width:none}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:8px 14px;border-radius:12px;font-size:15px;font-weight:500;color:var(--ink)}
  nav.tabs button b{font-size:19px;width:24px;text-align:center;color:var(--muted)}
  nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
  nav.tabs button.on b{color:var(--accent)}
  nav.tabs button:hover:not(.on){background:var(--chip)}
  main{max-width:1120px;padding:32px 40px}
  h1{font-size:28px}
  .home-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
  .home-side>.label:first-child{margin-top:16px}
  .page-session{max-width:720px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .tile .tk{font-size:38px}
  .actions{grid-template-columns:1fr 1fr}
  .action{flex-direction:column;align-items:flex-start;gap:10px}
  #sheet .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(700px,92vw);max-height:86vh;border-radius:20px;padding:24px 28px}
  .toast{bottom:32px;left:calc(50% + 118px)}
  .btn{width:auto;min-width:160px}
  .btnrow .btn,.rates .rate{min-width:0}
  .page-session .btn,.page-settings .btn{width:100%}
}
@media (min-width:1300px){ .tiles{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))} }


/* =====================================================================
   STATION — default design. Japanese rail signage: platform white,
   asphalt ink, Shinkansen indigo for actions, JLPT levels as line colours.
   Skins (Terminal / Sakura / Ocean) below override the tokens.
   ===================================================================== */
:root{
  --bg:#F5F7F6;--card:#FFFFFF;--ink:#1C2127;--muted:#5D6670;--line:#E3E7E5;--chip:#EDF0EE;
  --accent:#22408F;--accent-soft:#E7ECF8;--ok:#2B9348;--ok-soft:#E3F3E7;--bad:#D7263D;--bad-soft:#FBE7EA;
  --warn:#B98000;--warn-soft:#FFF3CF;--yellow:#F2C200;
  --n5:#4DAF4A;--n4:#F0802A;--n3:#1BA1D8;--n2:#D9A800;--n1:#C2337A;--lc:var(--accent);
  --shadow:0 1px 0 rgba(28,33,39,.06);--lift:0 10px 28px -12px rgba(28,33,39,.28);
  --r-sign:8px;--r-tile:14px;--r-pill:999px;
  --ff:"Barlow",system-ui,sans-serif;--ffj:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1317;--card:#171C22;--ink:#E8ECEF;--muted:#98A2AC;--line:#28303A;--chip:#1E242B;
    --accent:#86A2FF;--accent-soft:#1C2645;--ok:#4CC47A;--ok-soft:#13301F;--bad:#FF5D6E;--bad-soft:#3A1820;
    --warn:#F2C200;--warn-soft:#30280B;--shadow:none;--lift:0 10px 28px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1317;--card:#171C22;--ink:#E8ECEF;--muted:#98A2AC;--line:#28303A;--chip:#1E242B;
  --accent:#86A2FF;--accent-soft:#1C2645;--ok:#4CC47A;--ok-soft:#13301F;--bad:#FF5D6E;--bad-soft:#3A1820;
  --warn:#F2C200;--warn-soft:#30280B;--shadow:none;--lift:0 10px 28px -12px rgba(0,0,0,.6);
}
body{font-family:var(--ff);font-size:16px;line-height:1.45;letter-spacing:.005em}
.jp,nav.tabs button b,.logo{font-family:var(--ffj)}
h1{font-family:var(--ffj);font-weight:900;font-size:26px;letter-spacing:-.01em;line-height:1.25;margin:2px 0 6px}
h1 .muted{font-weight:500;font-family:var(--ff)}
.sub{font-size:15px;max-width:60ch}
.label{text-transform:none;letter-spacing:0;font-size:14px;font-weight:700;color:var(--ink);margin:22px 0 8px}
.note{font-size:13px}
.muted{color:var(--muted)}

/* header + navigation */
header.top{background:color-mix(in srgb,var(--bg) 88%,transparent);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;font-weight:900;font-size:17px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.brand{font-weight:700;font-size:16px}
.brand small{font-size:12px}
nav.tabs{background:var(--card);border-top:1px solid var(--line)}
nav.tabs button{position:relative;font-weight:600;font-size:11px;padding:8px 0 10px}
nav.tabs button b{font-size:19px;font-weight:700}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs button.on b{color:var(--accent)}

/* controls */
.btn{border-radius:12px;font-weight:700;font-size:16px;padding:14px 18px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.18)}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.line{background:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:focus-visible,.choice:focus-visible,.row:focus-visible,.chip:focus-visible,.seg button:focus-visible,summary:focus-visible,.mode:focus-visible,.stop:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.seg{background:var(--chip);border-radius:12px;padding:4px}
.seg button{font-weight:600;font-size:14px;border-radius:9px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.08),0 0 0 1px var(--line)}
.chip{font-weight:600;font-size:14px;padding:7px 13px;background:var(--card);border-color:var(--line)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.card{border-radius:var(--r-tile);box-shadow:var(--shadow)}

/* level badges = line colours (set by paintLevels) */
.tag{font-weight:600;border-radius:6px}
.tag.lv{background:var(--lc);color:#fff;font-weight:700;letter-spacing:.02em;border-radius:5px;padding:3px 7px}
.lvl{color:var(--lc)!important}
.pbar{background:var(--chip);border-radius:99px;height:8px}
.pbar i{background:var(--lc)}
.pbar i.l{background:color-mix(in srgb,var(--lc) 35%,var(--chip))}

/* options drawer: settings tucked behind one summary row */
details.opts{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
details.opts>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-size:14px}
details.opts>summary::-webkit-details-marker{display:none}
details.opts>summary .ot{font-weight:700}
details.opts>summary .os{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
details.opts>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .15s;flex:none}
details.opts[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
details.opts .ob{padding:0 14px 14px;border-top:1px solid var(--line)}
details.opts .ob>.label:first-child{margin-top:12px}

/* vocab modes */
.vtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:4px -16px 0;padding:2px 16px 6px}
.vtabs::-webkit-scrollbar{display:none}
.mode{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:8px 14px 8px 8px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.mode b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-family:var(--ffj);font-size:14px}
.mode.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode.on b{background:var(--accent);color:#fff}

/* ---------- station sign (駅名標): words on Home and in details ---------- */
.sign{border-radius:var(--r-sign);background:var(--card);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow);position:relative}
.sign-top{display:flex;align-items:center;gap:10px;padding:12px 14px 0}
.sign-no{font-family:var(--ff);font-weight:700;font-size:12px;color:#fff;background:var(--lc);border-radius:5px;padding:3px 7px;letter-spacing:.02em}
.sign-kana{color:var(--muted);font-size:15px;flex:1}
.sign-word{font-family:var(--ffj);font-weight:900;font-size:46px;line-height:1.15;text-align:center;padding:6px 14px 12px;letter-spacing:.04em;word-break:keep-all}
.sign-band{background:var(--lc);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 14px;font-weight:600;font-size:15px;min-height:34px;position:relative}
.sign-band::before,.sign-band::after{content:"";position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:#fff;transform:translateY(-50%);opacity:.9}
.sign-band::before{left:12px}.sign-band::after{right:12px}
.sign-mean{padding:12px 14px 14px;font-size:18px;font-weight:600;text-align:center}
.sign .say{top:8px;right:8px}
.sign .say.inl{position:absolute}
.detail .sign{margin:4px 0 10px}

/* ---------- Home: today's line ---------- */
.hello{font-size:30px;margin-bottom:2px}
.hello small{display:block;font-family:var(--ff);font-weight:500;font-size:15px;color:var(--muted);letter-spacing:0;margin-top:2px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--line);padding:6px 12px;font-weight:600;font-size:14px}
.badge b{font-size:16px}
.route{position:relative;margin:18px 0 6px;padding-left:4px}
.route::before{content:"";position:absolute;left:19px;top:22px;bottom:22px;width:6px;border-radius:3px;background:var(--line)}
.route .run{position:absolute;left:19px;top:22px;width:6px;border-radius:3px;background:var(--accent);transform-origin:top;height:var(--run,0)}
.route.draw .run{animation:kd-run .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes kd-run{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.stop{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;padding:8px 0;cursor:pointer;color:var(--ink)}
.stop .pin{flex:none;width:36px;height:36px;border-radius:50%;background:var(--card);border:4px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;z-index:1;color:var(--muted)}
.stop.done .pin{background:var(--accent);border-color:var(--accent);color:#fff}
.stop.next .pin{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.stop .sb{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-tile);padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.stop.next .sb{border-color:var(--accent);box-shadow:var(--lift)}
.stop .sb .t{flex:1;min-width:0}
.stop .sb b{display:block;font-size:16px}
.stop .sb span{display:block;font-size:13px;color:var(--muted)}
.stop .go{font-weight:700;font-size:14px;color:var(--accent);flex:none}
.stop.done .sb{opacity:.75}
.lines{display:grid;gap:12px}
.lines h3{font-size:14px;margin:0 0 6px;font-weight:700}
.lnrow{display:grid;grid-template-columns:40px 1fr 74px;align-items:center;gap:10px;font-size:13px;margin:6px 0}
.lnrow .tag.lv{text-align:center}
.lnrow span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.elsewhere{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.elsewhere button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);text-align:left}
.elsewhere button b{font-family:var(--ffj);font-size:18px;color:var(--accent);width:22px;text-align:center}

/* ---------- study screens ---------- */
.qtop{gap:10px}
.qtitle{flex:1;text-align:center;font-weight:700;font-size:14px;color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.combo{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-pill);background:var(--yellow);color:#1C2127;font-weight:800;font-size:13px;padding:3px 10px}
.combo.bump{animation:kd-bump .35s ease-out}
@keyframes kd-bump{40%{transform:scale(1.18)}}
.track{display:flex;align-items:center;gap:0;margin:2px 0 14px;height:14px}
.track i{flex:1;height:4px;background:var(--line);position:relative}
.track i::after{content:"";position:absolute;right:-5px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--line);transform:translateY(-50%);z-index:1;box-sizing:border-box}
.track i.ok{background:var(--ok)}.track i.ok::after{background:var(--ok);border-color:var(--ok)}
.track i.bad{background:var(--bad)}.track i.bad::after{background:var(--bad);border-color:var(--bad)}
.track i.cur::after{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);width:12px;height:12px;right:-6px}
.track i:first-child{flex:.3}
.prompt{border-radius:var(--r-sign);padding:34px 16px 22px}
.prompt .pmeta{margin-top:14px}
.pword,.pkanji{font-family:var(--ffj);font-weight:700}
.pmean{font-weight:700}
.choice{border-radius:var(--r-tile);border-width:2px;font-weight:600;min-height:60px;box-shadow:0 2px 0 var(--line)}
.choice .n{width:26px;height:26px;border-radius:7px;font-weight:700;font-size:12px;background:var(--chip);color:var(--ink)}
.choice:hover{border-color:var(--accent)}
.choice.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 2px 0 var(--ok)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 2px 0 var(--bad)}
.choice.ok.picked{animation:kd-pop .32s ease-out}
.choice.bad{animation:kd-shake .3s ease-in-out}
@keyframes kd-pop{50%{transform:scale(1.03)}}
@keyframes kd-shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{position:sticky;bottom:calc(80px + env(safe-area-inset-bottom));z-index:6;margin-top:14px;border-radius:var(--r-tile);padding:12px;display:flex;align-items:center;gap:10px;box-shadow:var(--lift);animation:kd-rise .22s ease-out}
.feedback.good{background:var(--ok);color:#fff}
.feedback.bad{background:var(--bad);color:#fff}
.feedback .fv{flex:1;font-weight:700;font-size:15px;line-height:1.25}
.feedback .fv small{display:block;font-weight:500;opacity:.9;font-size:13px}
.feedback .btn{margin:0;width:auto;background:#fff;color:var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);padding:11px 18px}
.feedback .vplay{background:rgba(255,255,255,.22);color:#fff}
@keyframes kd-rise{from{transform:translateY(12px);opacity:0}}
.verdict{display:none}
.fcard{border-radius:var(--r-sign)}
.rate{border-radius:12px;border-width:2px}
.score{border-radius:var(--r-sign)}
.score .big{font-family:var(--ffj);font-weight:900}
.arrive{font-family:var(--ffj);font-weight:900;font-size:22px}

/* lists, tiles, panels */
.row{border-radius:12px}
.row .rw{font-family:var(--ffj);font-weight:500}
.tile,.kcell,.sitcard,.action{border-radius:var(--r-tile)}
.sitcard{box-shadow:var(--shadow)}
.sheet{border-radius:18px 18px 0 0}
.kbig{border-radius:var(--r-sign)}
.toast{font-weight:600}
.banner{border-radius:12px;border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.stats .stat{border-radius:var(--r-tile)}

@media (max-width:599px){
  .vtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 0;padding:2px 0 4px;overflow:visible}
  .mode{flex-direction:column;gap:4px;padding:8px 2px 7px;border-radius:12px;font-size:11.5px;line-height:1.15;text-align:center}
  .mode b{width:30px;height:30px;font-size:15px}
}
@media (min-width:900px){
  .hello{font-size:36px}
  nav.tabs{padding-top:96px;display:flex;flex-direction:column;overflow-y:auto}
  nav.tabs .in{gap:6px;width:100%;margin:0;align-items:stretch}
  nav.tabs button{padding:12px 16px 12px 18px;gap:16px;font-size:16.5px;font-weight:600;letter-spacing:.01em;border-radius:14px}
  nav.tabs button b{font-size:24px;width:30px;line-height:1.2}
  .nav-foot{display:block}
  .home-grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .feedback{bottom:20px}
  .vtabs{margin:4px 0 0;padding:2px 0 6px;flex-wrap:wrap}
  nav.tabs button.on{background:var(--accent-soft)}
  nav.tabs button.on::before{left:0;right:auto;top:20%;bottom:20%;width:3px;height:auto;border-radius:0 3px 3px 0}
  .sign-word{font-size:54px}
}
@media (prefers-reduced-motion:reduce){
  .route.draw .run,.combo.bump,.choice.ok.picked,.choice.bad,.feedback{animation:none!important}
}

/* --- Terminal: green-on-black hacker look, always dark --- */
:root[data-skin="terminal"]{
  --bg:#010b05;--card:#03140a;--ink:#3dff7a;--muted:#20a650;--line:#0d4020;--chip:#062514;
  --accent:#39ff14;--accent-soft:#0a3315;--ok:#39ff14;--ok-soft:#08300f;--bad:#ff3b5c;--bad-soft:#2e0a12;
  --warn:#e6ff3b;--warn-soft:#262b08;--shadow:0 0 0 1px rgba(57,255,20,.05),0 0 18px rgba(57,255,20,.06);color-scheme:dark;
}

:root[data-skin="terminal"] .sign-band,:root[data-skin="terminal"] .feedback.good{color:#011006}
:root[data-skin="terminal"] .jp,:root[data-skin="terminal"] nav.tabs button b,:root[data-skin="terminal"] .logo{font-family:"M PLUS 1 Code","Noto Sans JP",monospace}
:root[data-skin="terminal"] *{border-radius:2px!important}
:root[data-skin="terminal"] .dot{border-radius:0!important}

:root[data-skin="terminal"] .btn.sec,:root[data-skin="terminal"] .btn.line{background:none;color:var(--accent);border:1px solid var(--accent);box-shadow:none}
:root[data-skin="terminal"] .btn.danger{background:none;border:1px solid var(--bad);color:var(--bad);box-shadow:none}
:root[data-skin="terminal"] .btn::before{content:"$ ";opacity:.7}

:root[data-skin="terminal"] .rate.again{background:none}
:root[data-skin="terminal"] h1::before{content:"> ";color:var(--muted)}
:root[data-skin="terminal"] h1::after{content:"_";color:var(--accent);animation:kd-blink 1.1s steps(1) infinite;margin-left:2px}
:root[data-skin="terminal"] h1,:root[data-skin="terminal"] .pword,:root[data-skin="terminal"] .pkanji,:root[data-skin="terminal"] .dword,:root[data-skin="terminal"] .score .big,:root[data-skin="terminal"] .kbig{text-shadow:0 0 10px rgba(57,255,20,.45)}
:root[data-skin="terminal"] .label::before{content:"// ";opacity:.6}
:root[data-skin="terminal"] .hello::after{content:none}
:root[data-skin="terminal"] .card,:root[data-skin="terminal"] .action,:root[data-skin="terminal"] .row,:root[data-skin="terminal"] .tile,:root[data-skin="terminal"] .choice{border-color:var(--line)}
:root[data-skin="terminal"] .choice:hover,:root[data-skin="terminal"] .row:hover,:root[data-skin="terminal"] .tile:hover,:root[data-skin="terminal"] .action:hover{border-color:var(--accent);box-shadow:0 0 10px rgba(57,255,20,.18)}
:root[data-skin="terminal"] .sheet-bg{background:rgba(0,10,3,.75)}
:root[data-skin="terminal"] .sw input:checked+span:before{background:#011006}
:root[data-skin="terminal"] .toast{background:var(--accent);color:#011006}
:root[data-skin="terminal"] ::selection{background:var(--accent);color:#011006}
:root[data-skin="terminal"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.16) 3px);mix-blend-mode:multiply}
@keyframes kd-blink{50%{opacity:0}}

/** Align a word with its reading → {漢字|かな} markup (client copy of the builder's algorithm). */
function furi(surface, reading) {
  if (!reading || ![...surface].some(isK)) return surface;
  const hr = kata2hira(reading), segs = [];
  for (const ch of surface) { const k = isK(ch); const l = segs[segs.length - 1]; if (l && l.k === k) l.t += ch; else segs.push({ k, t: ch }); }
  const m = new RegExp('^' + segs.map(s => s.k ? '(.+?)' : reEsc(kata2hira(s.t))).join('') + '$').exec(hr);
  if (!m) return `{${surface}|${hr}}`;
  let g = 1; return segs.map(s => s.k ? `{${s.t}|${m[g++]}}` : s.t).join('');
}
function ruby(s, force) {
  const h = esc(s);

}

function toRomaji(s) {
  s = String(s).replace(/[.\-]/g, '').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i], n = s[i + 1];
    if (c === 'っ') { const nx = toRomaji(s.slice(i + 1, i + 2)); out += nx && /[a-z]/.test(nx[0]) ? (nx.startsWith('ch') ? 't' : nx[0]) : ''; continue; }
    if (c === 'ー') { const v = out.match(/[aeiou]$/); out += v ? v[0] : ''; continue; }
    let r = ROMA[c];
    if (r === undefined) { out += c === '、' ? ', ' : c; continue; }
    if (n && YOON[n] && r.length > 1 && r.endsWith('i')) {
      const y = YOON[n];
      if (r === 'shi') r = 'sh' + y[1]; else if (r === 'chi') r = 'ch' + y[1]; else if (r === 'ji') r = 'j' + y[1]; else r = r.slice(0, -1) + y;
      i++;
    } else if (n && SMALLV[n] && r.length > 1 && !'ぁぃぅぇぉ'.includes(c)) { r = (r === 'fu' ? 'f' : r === 'tsu' ? 'ts' : r.slice(0, -1)) + SMALLV[n]; i++; }
    out += r;
  }
  return out;
}

/* Audio = native recordings only (Tofugu / WaniKani, Kanji alive, Tatoeba).
   No synthetic device voice: where there is no recording, no play button is shown. */
let curAudio = null;
const hasRec = id => !!id && (String(id).startsWith('a:') || DATA.mode === 'full');
function playAudio(id, again) {
  if (!hasRec(id)) return;                       // nothing to play: let the current recording finish
  // the same recording asked for twice in a row (autoplay + tap): don't restart it halfway through
  if (!again && curAudio && curAudio.dataset.id === id && !curAudio.ended && !curAudio.paused && curAudio.currentTime < 0.6) return;
  if (!again && ANKI.pending === id) return;
  if (curAudio) { try { curAudio.pause(); } catch (e) {} curAudio = null; }
  if (String(id).startsWith('a:')) {   // a recording from the learner's own Anki deck
    ANKI.pending = id;
    ankiMediaUrl(id).then(url => {
      if (ANKI.pending !== id) return; ANKI.pending = null;
      if (!url) { toast('Recording unavailable'); return; }
      const a = new Audio(url); a.dataset.id = id; curAudio = a; const pr = a.play(); if (pr && pr.catch) pr.catch(() => {});
    });
    return;
  }
  ANKI.pending = null;
  try {
    const a = new Audio(id[0] === 's' ? `data/saudio/${id.slice(1)}.mp3` : `data/audio/${id}.mp3`); a.dataset.id = id; a.preload = 'auto'; curAudio = a;
    a.onerror = () => toast('Recording unavailable');
    const pr = a.play(); if (pr && pr.catch) pr.catch(e => { if (e && e.name === 'NotSupportedError') toast('Recording unavailable'); });
  } catch (e) {}
}

function searchResults() {

      if (forms.includes(q0) || kata2hira(x.r) === qh) s = 100;
      else if (forms.some(f => f.startsWith(q0)) || kata2hira(x.r).startsWith(qh)) s = 60;
      else if (forms.some(f => f.includes(q0))) s = 30;

/* ---------- detail cards ---------- */
/* Example sentences normally arrive with furigana from the build (kuromoji).
   If a sentence has none, annotate its kanji using readings from the word list:
   longest dictionary match first, verb/adjective stems (食べ-, 行-), and single
   kanji only when they stand alone (so 山 in 富士山 isn't read やま). */
let FURIX = null;
function furiIndex() {
  if (FURIX) return FURIX;
  const words = new Map(), stems = new Map(); let maxLen = 1;
  const add = (w, f) => { if (!words.has(w)) { words.set(w, f); maxLen = Math.max(maxLen, w.length); } };
  for (const x of V) {
    if (![...x.w].some(isK) || !x.f.includes('{')) continue;
    add(x.w, x.f);
    if ((x.pos === 'verb' || x.pos === 'i-adj') && /[ぁ-ん]$/.test(x.w) && x.f.endsWith(x.w.slice(-1))) {
      const stem = x.w.slice(0, -1), fs = x.f.slice(0, -1);
      if (stem.length >= 2 && /[ぁ-ん]$/.test(stem)) add(stem, fs);
      const m = /^\{(.)\|([^}]+)\}[ぁ-ん]/.exec(x.f);
      if (m && x.w[0] === m[1] && !'来'.includes(m[1]) && !stems.has(m[1])) stems.set(m[1], `{${m[1]}|${m[2]}}`);
    }

  return (FURIX = { words, stems, maxLen });
}
function autoFuri(t) {

  const { words, stems, maxLen } = furiIndex(); let out = '';
  for (let i = 0; i < t.length;) {
    if (!isK(t[i])) { out += t[i++]; continue; }
    let hit = null;
    for (let L = Math.min(maxLen, t.length - i); L >= 1 && !hit; L--) {
      const sub = t.slice(i, i + L), f = words.get(sub); if (!f) continue;
      if (L === 1 && ((i > 0 && isK(t[i - 1])) || (t[i + 1] && isK(t[i + 1])))) continue;
      if (L === 1 && stems.has(t[i]) && /[ぁ-ん]/.test(t[i + 1] || '')) continue;
      hit = [L, f];
    }
    if (!hit && stems.has(t[i]) && /[ぁ-ん]/.test(t[i + 1] || '') && !(i > 0 && isK(t[i - 1]))) hit = [1, stems.get(t[i])];
    if (hit) { out += hit[1]; i += hit[0]; } else out += t[i++];
  }
  return out;
}
/* ---------- sentences with furigana and one special range ----------

function rubyTag(t, r) { return settings.furigana === 'off' ? esc(t) : `<ruby>${esc(t)}<rt>${esc(r)}</rt></ruby>`; }

  const s = S.session; if (!s || s.mode !== 'cards' || !s.flipped) return;

  const h = { idx: s.idx, id: item.id, g, day, prev: progress[item.id] ? { ...progress[item.id] } : null, log: actLog[day] ? { ...actLog[day] } : null, inserted: -1 };

  s.hist.push(h);

  if (s.idx >= s.queue.length) s.done = true;

  if (!s.done && settings.autoSpeak && s.kind === 'vocab' && settings.cardFront === 'jp') playWord(s.queue[s.idx]);

/** Go back to the previous card and undo its rating, so it can be rated again. */

  if (h.log) actLog[h.day] = h.log; else delete actLog[h.day];

  if (h.inserted >= 0) s.queue.splice(h.inserted, 1);

const grammarFull = () => DATA.mode === 'full' && DATA.meta && DATA.meta.counts && DATA.meta.counts.grammar && Object.values(DATA.meta.counts.grammar).some(n => n > 0);

/** Japanese forms of a grammar point that can be found in (and blanked out of) a sentence.
    "〜てはいけない" → てはいけない, てはいけません; "だ / です" → だ, です; "たことがある" → …あります */
function gVariants(g) {
  if (g._v) return g._v;
  const base = plain(g.t).replace(/[（(][^）)]*[）)]/g, ' ').split(/[\/／・,、;…]|\.\.\.|\s+or\s+/)
    .map(x => x.replace(/[〜~～…]|[A-Za-z+]+|\s+/g, '').trim()).filter(x => /[぀-ヿ㐀-鿿]/.test(x));
  const out = [], push = (v, tag) => { if (v && !out.some(o => o.v === v)) out.push({ v, tag }); };
  const U = { う: 'い', く: 'き', ぐ: 'ぎ', す: 'し', つ: 'ち', ぬ: 'に', ぶ: 'び', む: 'み' };
  for (const b of base) {
    push(b, 'plain');
    if (/(ます|です|ましょう|でしょう|ません|ました|でした)$/.test(b)) continue; // already conjugated
    if (/ならない$/.test(b)) push(b.replace(/ならない$/, 'なりません'), 'masen');
    else if (/ない$/.test(b)) push(b.replace(/ない$/, 'ません'), 'masen');
    if (/だ$/.test(b)) push(b.replace(/だ$/, 'です'), 'desu');
    if (/ある$/.test(b)) push(b.replace(/ある$/, 'あります'), 'masu');
    else if (/る$/.test(b)) push(b.slice(0, -1) + 'ます', 'masu');
    else if (U[b.slice(-1)]) push(b.slice(0, -1) + U[b.slice(-1)] + 'ます', 'masu');

  return (g._v = out);
}
/** Find an example sentence containing one of the grammar's forms (longest match wins). */
function gBlank(g) {
  const vs = gVariants(g).slice().sort((a, b) => b.v.length - a.v.length);
  for (const e of shuffle(g.ex)) {

const grammarOverlap = (a, b) => normM(a.m) === normM(b.m) || a.t === b.t;
/** Wrong options for a fill-in grammar question, in the same politeness as the blank. */
function gFillOpts(item, v, pool, sentence) {
  const cands = [], seen = new Set([v.v]), L = v.v.length;
  for (const x of shuffle(pool)) {
    if (x === item || grammarOverlap(item, x)) continue;
    const vs = gVariants(x); const c = vs.find(o => o.tag === v.tag) || vs[0];
    if (!c || seen.has(c.v) || c.v.includes(v.v) || v.v.includes(c.v) || /[。、？！?!,.]/.test(c.v)) continue;
    seen.add(c.v); cands.push({ v: c.v, score: Math.abs(c.v.length - L) + (c.tag === v.tag ? 0 : 2) });

}

function makeKanaQ(item, dir) {

    const extra = shuffle(otherScript.filter(x => x !== target && x.ro !== target.ro && !wrong.includes(x)));
    const opts = shuffle([target, ...wrong.concat(extra).slice(0, 3)]);

  rd: [['{先生|せんせい}: みなさん、{座|すわ}って ください。', 'Teacher: Everyone, please sit down.'], ['{教科書|きょうかしょ}を {開|あ}けて ください。', 'Please open your textbooks.'], ['{十|じゅう}ページを {読|よ}んで ください。', 'Please read page 10.'], ['{分|わ}かりませんか。じゃあ、もう{一度|いちど} {言|い}いますね。', 'You don’t understand? Then I’ll say it once more.']],

let pathSt = Object.assign({ done: {}, place: null }, store.get('path', {}));
const savePath = () => store.set('path', pathSt);
const PATHX = {};
/** a unit word as a vocab item: the dictionary entry if there is one (matching spelling variants such as ご飯 / 御飯), else a lesson-only entry */
function pathWord(w, r, m, lvl) {
  const id = 'v:' + w + '|' + r;
  if (VMAP[id]) return VMAP[id];
  const rh = kata2hira(r), ks = hanOf(w).filter(c => c !== '御');
  const hit = V.find(x => kata2hira(x.r) === rh && (x.w === w || x.alt === w || (ks.length && ks.every(c => x.w.includes(c)) && hanOf(x.w).filter(c => c !== '御').length === ks.length)));
  if (hit) return hit;
  if (!PATHX[id]) {
    const x = normV({ i: null, w, r, f: furi(w, r), m, s: [{ p: [], g: m.split(/;\s*|,\s*/) }], g: 'other', q: 3, ex: [] }, lvl);
    x.id = id; x.pic = STARTER_PICS.v[w] || null; PATHX[id] = x;

}
/* ---------- units ---------- */
/* ---------- the plan for each level ----------

  'n5-05': ['ここ', 'そこ', 'あそこ', 'どこ'], 'n5-06': ['いくら'], 'n5-07': ['から', 'まで', 'からまで'], 'n5-08': ['へ', 'ます', 'ません', 'に行く'], 'n5-09': ['を'], 'n5-10': ['で', 'に'],
  'n5-11': ['ました', 'ませんでした', 'と'], 'n5-12': ['い-adjectives', 'い形容詞', 'くない', 'とても', 'あまり'], 'n5-13': ['な-adjectives', 'な形容詞'], 'n5-14': ['あります', 'います', 'ある', 'いる', 'がある', 'がいる'],
  'n5-15': ['が', 'が好き', 'が上手', 'が分かる'], 'n5-16': ['たい', 'たいです'], 'n5-17': ['ませんか', 'ましょう', 'ましょうか'], 'n5-18': ['てください', 'て-form'], 'n5-19': ['ている', 'ています'],
  'n5-20': ['てもいい', 'てもいいです', 'てはいけない', 'てはいけません', 'ないでください'], 'n5-21': ['かった', 'でした'], 'n5-22': ['より', 'ほうが', 'のほうが', '一番', 'どちら'], 'n5-23': ['から', 'が', 'でも'] };
const gKey = g => String(gSplitTitle(g.t).jp || g.t).replace(/[〜～…・\s()（）＋+]/g, '').split(/[\/／,、]/)[0];
const coreCovers = g => { const k = gKey(g).replace(/(です)?[。.]$/, ''); return !!k && Object.values(N5_GK).some(ts => ts.includes(k)); };
let PLAN = {};
function planUnits(l) {
  // a word listed twice (in this level, or already in an easier one) is taught once
  const lower = new Set(LV.slice(0, LV.indexOf(l)).flatMap(k => [...(DATA.vocab[k] || []).map(x => x.id), ...planUnits(k).flatMap(u => (u.items || []).map(x => x.id))])), once = new Set();
  const words = (DATA.vocab[l] || []).filter(x => x.w && x.m && !lower.has(x.id) && !once.has(x.id) && once.add(x.id)), gram = (DATA.grammar[l] || []).filter(g => g.m), kan = K.filter(k => k.lvl === l);
  const dkey = ANKI.items.length ? ANKI.planKey : '';
  const sig = [words.length, gram.length, kan.length, V.length, dkey].join(':');
  if (PLAN[l] && PLAN[l].sig === sig) return PLAN[l].units;
  const taught = new Set(), core = [];
  if (l === 'N5') PATH_N5.forEach(u => { Object.assign(u, { lvl: 'N5', tr: 'jlpt', core: true, g: [] }); u.items = u.w.map(([w, r, m]) => pathWord(w, r, m, 'N5')); u.items.forEach(x => taught.add(x.id)); core.push(u); });
  // grammar comes alphabetically from the source; teach it simplest first: short patterns with short, plain examples
  const gDiff = g => { const ex = g.ex.map(e => plain(e.j)); const len = ex.length ? ex.reduce((a, t) => a + t.length, 0) / ex.length : 30; const hard = ex.join('').split('').filter(c => isK(c) && (!KMAP[c] || LV.indexOf(KMAP[c].lvl) < LV.indexOf(l))).length / Math.max(1, ex.length); return len + gKey(g).length * 3 + hard * 4; };
  const restG = gram.filter(g => !(l === 'N5' && coreCovers(g))).map(g => [g, gDiff(g)]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
  const restW = words.filter(x => !taught.has(x.id)).sort((a, b) => b.freq - a.freq || (a.seq || 0) - (b.seq || 0));
  let lessons, known = [], baseCount = 0;
  const base = genLessons(l, restG, restW, words, 'c');
  if (!dkey) lessons = core.concat(base);
  else {
    /* With an Anki deck the level is re-planned around it:
       - lessons you've already finished stay exactly as they were;
       - words you already know in Anki count as covered and aren't taught again;
       - the deck's other words come first, in the deck's order, so the Path teaches what you're studying in Anki now. */
    baseCount = core.length + base.length;

    const usedW = new Set(kept.flatMap(u => u.items.map(x => x.id))), usedG = new Set(kept.flatMap(u => u.g));
    known = restW.filter(x => !usedW.has(x.id) && ANKI.known.has(x.id));
    const kn = new Set(known.map(x => x.id)), rk = x => ANKI.rank.has(x.id) ? ANKI.rank.get(x.id) : 1e9;
    const todo = restW.filter(x => !usedW.has(x.id) && !kn.has(x.id)).map((x, i) => [x, i]).sort((a, b) => (rk(a[0]) - rk(b[0])) || a[1] - b[1]).map(a => a[0]);

  const leftK = kan.filter(k => !kdone.has(k.k));

  leftK.forEach(k => { const u = tgt.slice().sort((a, b) => a.kan.length - b.kan.length)[0]; if (u) { u.kan.push(k.k); kdone.add(k.k); } });

  const units = [];

/** coverage lessons for a level: about 12 words and one or two grammar points each, with real example sentences */
function genLessons(l, restG, restW, words, pre) {
  const nGen = Math.max(restG.length ? Math.ceil(restG.length / 2) : 0, Math.ceil(restW.length / WPU));

  restG.forEach((g, i) => gen[Math.floor(i * nGen / restG.length)].g.push(g));
  const pool = new Set(restW);

  });

        return `<button class="lk" data-open="k:${esc(k.k)}"><span class="lk-k jp">${k.k}</span><span class="lk-b"><b>${esc(k.mean.slice(0, 2).join(', '))}</b><span class="jp">${esc([...k.on.slice(0, 1).map(kataOf), ...k.kun.slice(0, 1)].join('・'))}</span>${k.og ? (k.og.t === 'S' ? (k.og.sem || k.og.pho ? `<span class="lk-o">${k.og.sem ? `${esc(k.og.sem)} gives the meaning` : ''}${k.og.sem && k.og.pho ? ', ' : ''}${k.og.pho ? `${esc(k.og.pho)} gives the sound` : ''}</span>` : '') : k.og.h ? `<span class="lk-o">${esc(k.og.h)}</span>` : '') : ''}${w ? `<span class="lk-w">in <span class="jp">${esc(w.w)}</span> ${esc(w.m.split(/[;,]/)[0])}</span>` : ''}</span></button>${kpStrip(k.k, 'sm')}`; }).join('')}</div>`;
  } else if (step === 'read') {
    const lines = lessonLines(u).map(x => [x.j, x.e, x.au]);

  } else if (step === 'talk') {
    body = `<div class="ls-h"><div class="ls-k">Conversation</div><h2>Hear it in a conversation</h2><p class="note">Read both parts. Then cover one side and say it yourself.</p></div>
      <div class="ltalk">${u.tk.map(([who, j, e], i) => { const me = who === 'B' || who === 'You'; return `<div class="bub${me ? ' me' : ''}"><span class="who">${esc(who)}</span><div class="ex"><div class="jp">${ruby(j, true)}</div></div><button class="ghost len${L.showEn['t' + i] ? ' on' : ''}" onclick="App.lessonEn('t${i}')">${L.showEn['t' + i] ? esc(e) : 'English'}</button></div>`; }).join('')}</div>`;
  } else if (step === 'quiz') {
    if (!L.quiz) L.quiz = lessonQuiz(L);
    const Q = L.quiz, q = Q.qs[Q.i];
    if (!q) { L.i++; return vLesson(); }
    const opts = q.opts.map((o, i) => { let c = 'choice'; if (Q.answered) c += (o.ok ? ' ok' : i === Q.chosen ? ' bad' : ' dim') + (i === Q.chosen ? ' picked' : ''); return `<button class="${c}" onclick="App.lessonAns(${i})"${Q.answered ? ' disabled' : ''}><span class="n">${i + 1}</span><span>${o.html}</span></button>`; }).join('');
    const ok = Q.answered && q.opts[Q.chosen].ok, right = (q.opts.find(o => o.ok) || {}).html || '';
    body = `<div class="ls-h"><div class="ls-k">Practice · ${Q.i + 1} of ${Q.qs.length}${q.review ? ' · from an earlier unit' : ''}</div></div>
      <div class="card prompt">${q.prompt}${q.meta ? `<div class="pmeta">${q.meta}</div>` : ''}${Q.answered ? sayBtn(q.au, 'say') : ''}</div>
      <div class="hint">${q.hint || ''}</div><div class="choices ${q.grid ? 'grid2' : ''}">${opts}</div>
      ${Q.answered ? answerCard(q.item) : ''}${Q.answered ? `<div class="feedback ${ok ? 'good' : 'bad'}" role="status"><div class="fv">${ok ? pick(['正解! Correct', 'いいね! Nice', 'すごい! Great']) + (gameOn() && game.combo >= 2 ? ` · ×${game.combo} combo` : '') : 'おしい! Not quite'}<small>${ok ? '' : 'Answer: '}${ok ? '' : right}</small></div><button class="btn" onclick="App.lessonQNext()">${Q.i + 1 < Q.qs.length ? 'Next' : 'Finish'}</button></div>` : ''}`;
    return `${head}<div class="lesson">${body}</div>`;
  } else if (step === 'done') {
    const Q = L.quiz || { ok: 0, n: 0, missed: [] }, pct = Q.n ? Math.round(Q.ok / Q.n * 100) : 100;
    if (!L.saved) finishLesson(L, pct);
