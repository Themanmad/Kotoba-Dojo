# Builds the dictionary data (JMdict, KANJIDIC2, KanjiVG, JLPT lists, Tatoeba)
# and publishes the app to GitHub Pages.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Runs on every push to main, every Monday (to pick up dictionary updates),
# and on demand from the Actions tab ("Run workflow").
name: Build data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Week number (refreshes the download cache weekly)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ steps.week.outputs.week }}
          restore-keys: sources-

      - name: Install ffmpeg (pads recordings with silence so phones don't cut the first syllable)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Install tokenizer (furigana for example sentences)
        run: npm install --no-save --no-package-lock --no-audit --no-fund kuromoji@0.1.2

      - name: Build data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node build-data.mjs --out _site/data --cache .cache

      - name: Assemble site
        run: |
          cp index.html _site/
          [ -f LICENSES.md ] && cp LICENSES.md _site/ || true
          [ -d vendor ] && cp -r vendor _site/ || true
          touch _site/.nojekyll
          du -sh _site/data && ls -la _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
